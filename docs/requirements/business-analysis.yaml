  question: Jak działa relacja głównego i dodatkowych opiekunów?
  resolution:
    answer: Pierwszy opiekun jest główny; wielu opiekunów jest dozwolonych. Główny
      potwierdza dodatkowych i może odebrać ich dostęp. Zmiana głównego wymaga jego
      zgody albo administratora; przy sporze możliwa jest blokada zmian. Utrata wszystkich
      dostępów wymaga ręcznej weryfikacji. Dziecko ma własny panel bez zarządzania
      opiekunami, płatnościami i zgodami dorosłego. Finalne dane i zgody są odroczone
      do produkcji w Q-007. Wcześniejsza odpowiedź była zachowana jako historyczna
      i zależna od Q-015; obecnie posiada bezpośrednie potwierdzenie.
    evidence: 'SRC-PLAN sha256:daf77f5364f1f5de20752d365f3f1aba976eaa45151b3d76515d6d2f3b8e6afc,
      Potwierdzenie wcześniejszych decyzji biznesowych — Q-015 / Q-003; historyczny
      zapis: SRC-PRIOR, Q-003 / resolution.'
  severity: NON_BLOCKER
