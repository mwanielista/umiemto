assumptions:
- description: Popyt i rentowność pozostają hipotezami do walidacji; przykładowe ceny,
    marże i budżety nie są zatwierdzonymi wartościami MVP.
  id: ASM-001
  source_refs:
  - locator: Wprowadzenie; §§6–7; Załącznik B; Potwierdzenie wcześniejszych decyzji
      biznesowych — Q-015 / Q-012
    source_id: SRC-PLAN
business_requirements:
- acceptance_criteria:
  - Pierwszy przypisany opiekun jest główny; dziecko może posiadać wielu opiekunów.
  - Dodanie dodatkowego opiekuna wymaga potwierdzenia głównego, który może odebrać
    dodatkowy dostęp.
  - Zmiana głównego wymaga jego zgody albo ręcznej interwencji administratora.
  - Przy sporze zmiany relacji mogą zostać zablokowane do ręcznego rozstrzygnięcia;
    odzyskanie po utracie wszystkich dostępów wymaga ręcznej weryfikacji administratora.
  - Dziecko posiada własny panel i nie zarządza opiekunami, płatnościami ani zgodami
    wymagającymi osoby dorosłej.
  - Osoba zakładająca konto opiekuna oświadcza pełnoletność, uprawnienie do zarządzania
    kontem dziecka w wymaganym zakresie i prawdziwość podanych informacji; szczegółowa
    forma oświadczenia i wymagane zgody podlegają weryfikacji prawnej przed produkcją.
  description: Opiekun zarządza udziałem dziecka, a relacja wielu opiekunów posiada
    określony cykl dostępu.
  id: BR-001
  priority: MUST
  rationale: Zapewnić odpowiedzialność dorosłego i kontrolę dostępu do dziecka.
  source_refs:
  - locator: §21 Parent responsibility
    source_id: SRC-AGENTS
  - locator: §8 Panel rodzica; §11 Kluczowe zasady; Ostateczne rozstrzygnięcie brakujących
      decyzji biznesowych — Q-016, §11; historyczne potwierdzenie Q-003 zachowane
      w dowodzie odpowiedzi Q-003
    source_id: SRC-PLAN
- acceptance_criteria:
  - Opiekun widzi przedmiot, grupę docelową, wymagania wejściowe, cele, efekty, harmonogram,
    zasady oceniania i pełną cenę brutto.
  - Liczba i długość zajęć, limity grupy oraz dostęp do materiałów odpowiadają opublikowanemu
    programowi.
  - Definicja modułu, wersja programu, grupa, harmonogram i zapis pozostają rozróżnialne.
  description: Oferta przedstawia cele i warunki programu oraz konkretnej grupy przed
    zakupem.
  id: BR-002
  priority: MUST
  rationale: Umożliwić świadomy wybór usługi.
  source_refs:
  - locator: §3 Dla rodzica
    source_id: SRC-PLAN
  - locator: §2 Product Goal; §21 Educational module model; Money
    source_id: SRC-AGENTS
- acceptance_criteria:
  - Program wskazuje wymagania wejściowe i sposób oceny ich spełnienia.
  - Diagnoza wskazuje dalszą ścieżkę według programu bez globalnego stosowania progów
    przykładu matematycznego.
  description: Kwalifikacja uwzględnia wymagania wejściowe lub diagnozę określone
    w programie.
  id: BR-003
  priority: MUST
  rationale: Dopasować naukę do poziomu uczestnika.
  source_refs:
  - locator: §12 Proces sprzedażowy
    source_id: SRC-PLAN
  - locator: Część A §3
    source_id: SRC-PROGRAM
- acceptance_criteria:
  - Zamówienie identyfikuje uczestnika, ofertę, grupę, kwotę, walutę i stan płatności.
  - Rezerwacja trwa 24 godziny od utworzenia zamówienia i wygasa bez skutecznej płatności.
  - Późna płatność nie gwarantuje miejsca; dostępne miejsce może zostać przypisane,
    a przy jego braku można zaproponować inną grupę.
  - Brak odpowiedniej grupy umożliwia pełny zwrot.
  - Ponowne potwierdzenie tej samej płatności nie tworzy dodatkowych płatności, zapisów
    ani operacji biznesowych.
  description: Zakup miejsca respektuje 24-godzinną rezerwację i zasady późnej płatności.
  id: BR-004
  priority: MUST
  rationale: Kontrolować dostępność miejsc i skutki wpłat.
  source_refs:
  - locator: Potwierdzenie wcześniejszych decyzji biznesowych — Q-015 / Q-004
    source_id: SRC-PLAN
  - locator: §21 Payments; Money
    source_id: SRC-AGENTS
- acceptance_criteria:
  - Brak zaliczenia sam w sobie nie blokuje wcześniejszego zakupu kolejnego etapu.
  - Skonfigurowany prerequisite blokuje rozpoczęcie do finalnego zaliczenia albo uprawnionego
    audytowanego wyjątku; wynik wstępny nie usuwa blokady.
  - Bez skonfigurowanego prerequisite nie występuje globalny obowiązek zaliczenia
    poprzednika.
  - Niespełnienie prerequisite przed startem umożliwia późniejszą grupę; przy jej
    braku płatność może zostać wykorzystana na przyszłą edycję albo zwrócona.
  - Wyjątek może przyznać nauczyciel będący właścicielem danego programu, administrator
    albo Michał Wanielista; sama rola metodyka nie daje automatycznie takiego prawa.
  - Ślad audytowy wyjątku zawiera co najmniej osobę podejmującą decyzję, czas i powód.
  description: Zakup następnika jest odrębny od spełnienia warunków jego rozpoczęcia.
  id: BR-005
  priority: MUST
  rationale: Oddzielić zobowiązanie handlowe od gotowości edukacyjnej.
  source_refs:
  - locator: §5 Ważna korekta procesu sprzedaży; Ostateczne rozstrzygnięcie brakujących
      decyzji biznesowych — Q-016, §§1 i 13; historyczne reguły handlowe zachowane
      w odpowiedzi Q-004
    source_id: SRC-PLAN
  - locator: §21 Learning progression; Manual grading
    source_id: SRC-AGENTS
- acceptance_criteria:
  - Uczestnik widzi terminy i sposób dołączenia do zewnętrznych lekcji online.
  - Liczba i długość zajęć oraz limity grupy odpowiadają programowi.
  - Nauczyciel rejestruje obecność; terminy są prezentowane w Europe/Warsaw z uwzględnieniem
    zmian czasu.
  description: Uczestnik otrzymuje harmonogram, a nauczyciel rejestruje obecność.
  id: BR-006
  priority: MUST
  rationale: Zapewnić przewidywalny przebieg zajęć.
  source_refs:
  - locator: §2 Product Goal; §3 MVP Scope; §21 Time
    source_id: SRC-AGENTS
  - locator: §8 Panel nauczyciela
    source_id: SRC-PLAN
- acceptance_criteria:
  - Uczeń odczytuje materiały, zadanie, termin i kryteria oraz przesyła odpowiedź.
  - Nauczyciel sprawdza odpowiedź wymagającą ręcznej oceny, a uprawniony opiekun widzi
    wykonanie i wynik.
  - Nieobecność nie odbiera dostępu do materiałów w okresie określonym w programie.
  - Spóźnione zadanie może zostać przyjęte do terminu egzaminu, chyba że program określa
    inaczej.
  description: Uczeń korzysta z materiałów i prac domowych oraz otrzymuje ocenę lub
    komentarz.
  id: BR-007
  priority: MUST
  rationale: Utrwalać umiejętności między zajęciami.
  source_refs:
  - locator: Część A §§6–7
    source_id: SRC-PROGRAM
  - locator: §2 Product Goal; §21 Manual grading
    source_id: SRC-AGENTS
  - locator: Potwierdzenie wcześniejszych decyzji biznesowych — Q-015 / Q-009
    source_id: SRC-PLAN
- acceptance_criteria:
  - Uczeń realizuje trening lub test próbny i otrzymuje podpowiedzi albo wyjaśnienia
    błędów.
  - Trening nie ujawnia pytań ani klucza właściwego egzaminu przed uprawnionym przeglądem.
  description: Uczeń ma trening i test próbny z informacją zwrotną odrębne od właściwego
    egzaminu.
  id: BR-008
  priority: MUST
  rationale: Umożliwić przygotowanie do oceny.
  source_refs:
  - locator: §5 Struktura jednego modułu; Przykładowy przebieg
    source_id: SRC-PLAN
  - locator: Część A §7
    source_id: SRC-PROGRAM
  - locator: §24 UI and Accessibility
    source_id: SRC-AGENTS
- acceptance_criteria:
  - Podczas publikacji nauczyciel definiuje kryteria ukończenia programu lub modułu.
  - Kryteria mogą obejmować egzamin, wykonanie określonych zadań, osiągnięcie wyniku,
    uczestnictwo w określonych zajęciach, ich kombinację albo wyłącznie realizację
    wymaganych elementów programu.
  - Ukończenie następuje po spełnieniu wszystkich kryteriów skonfigurowanych dla wersji
    programu uczestnika; egzamin nie jest globalnie wymagany.
  - Próg zaliczenia, gdy ma zastosowanie, kryteria efektów, czas, pomoce i reguły
    ponawiania oceny należą do właściwej wersji programu.
  - Próg 75%, liczba pytań i czas z przykładu nie obowiązują globalnie.
  description: Nauczyciel określa zasady oceniania i ukończenia w wersji programu.
  id: BR-009
  priority: MUST
  rationale: Dopasować ocenę i ukończenie do celów edukacyjnych.
  source_refs:
  - locator: §2 Product Goal; §21 Learning progression; Assessment rules
    source_id: SRC-AGENTS
  - locator: Część A §§4, 9–10; Część B jako przykład
    source_id: SRC-PROGRAM
  - locator: Ostateczne rozstrzygnięcie brakujących decyzji biznesowych — Q-016, §4
    source_id: SRC-PLAN
- acceptance_criteria:
  - Próba zachowuje wersje programu, pytań, kryteriów odpowiedzi i zasad oceny; późniejsza
    edycja nie zmienia historycznych wyników.
  - Wymagana ręczna ocena pozostawia wynik wstępny do zakończenia zatwierdzania i
    nie odblokowuje progresji wymagającej zaliczenia.
  - Wynik egzaminu lub zadania oznaczony do weryfikacji z powodu podejrzenia niesamodzielności
    nie uzyskuje finalnego zatwierdzenia do zakończenia ręcznej weryfikacji przez
    uprawnionego nauczyciela lub administratora.
  - Decyzja dotycząca niesamodzielności i jej uzasadnienie pozostawiają ślad audytowy.
  - Uprawniona korekta wyniku pozostawia ślad audytowy.
  description: Wynik wstępny jest odrębny od finalnego, a próba zachowuje historyczną
    podstawę oceniania i podlega ręcznej weryfikacji przy podejrzeniu niesamodzielności.
  id: BR-010
  priority: MUST
  rationale: Zapewnić wiarygodność historii wyników.
  source_refs:
  - locator: §21 Versioning; Manual grading; §23 Security and Privacy
    source_id: SRC-AGENTS
  - locator: Ostateczne rozstrzygnięcie brakujących decyzji biznesowych — Q-016, §9
    source_id: SRC-PLAN
- acceptance_criteria:
  - Żadna poprawka, także po pierwszej, nie powoduje opłaty ani wymogu zakupu kolejnej
    próby.
  - Uczeń ponawia ocenę według reguł właściwej wersji programu; bezpłatność nie ustanawia
    nieograniczonej liczby prób.
  - Finalne zaliczenie usuwa blokadę wynikającą z wymaganego zaliczenia; bez takiego
    warunku niezaliczenie nie blokuje kontynuacji.
  description: Wszystkie poprawki egzaminów są bezpłatne i podlegają zasadom programu.
  id: BR-011
  priority: MUST
  rationale: Umożliwić poprawę bez premiowania niezaliczeń przychodem.
  source_refs:
  - locator: §21 Retakes; Learning progression; Assessment rules
    source_id: SRC-AGENTS
- acceptance_criteria:
  - Raport obejmuje frekwencję, wykonanie prac, zastosowane oceny, osiągnięcie efektów,
    mocne strony i rekomendację.
  - Opiekun widzi historię uprawnionego dziecka; uczeń otrzymuje wspierający komentarz
    i następne działanie.
  description: Opiekun otrzymuje raport postępu, a uczeń zrozumiały następny krok.
  id: BR-012
  priority: MUST
  rationale: Uczynić wyniki nauki użytecznymi dla rodziny.
  source_refs:
  - locator: Część A §13
    source_id: SRC-PROGRAM
  - locator: §8 Panel rodzica; Panel dziecka
    source_id: SRC-PLAN
- acceptance_criteria:
  - Dziecko i opiekunowie dzielą limit jednego nowego wątku na aktywny program w tygodniu
    od poniedziałku 00:00 do niedzieli 23:59 Europe/Warsaw.
  - Niewykorzystany limit nie przechodzi na kolejny tydzień; odpowiedzi w istniejącym
    wątku nie zużywają kolejnego limitu.
  - Nauczyciel powinien odpowiedzieć w ciągu najwyżej dwóch dni roboczych, liczonych
    jako poniedziałek–piątek poza dniami ustawowo wolnymi w Polsce.
  - Nowy wątek można rozpocząć podczas aktywnego dostępu do programu; nauczyciel lub
    administrator może zamknąć zakończony wątek i moderować naruszenia zasad.
  - Komunikacja odbywa się przez platformę, jest archiwizowana i widoczna uprawnionemu
    opiekunowi.
  description: Konsultacje mają wspólny tygodniowy limit i określony termin odpowiedzi.
  id: BR-013
  priority: MUST
  rationale: Zapewnić kontrolowaną pomoc edukacyjną.
  source_refs:
  - locator: Potwierdzenie wcześniejszych decyzji biznesowych — Q-015 / Q-006
    source_id: SRC-PLAN
  - locator: §21 Consultations
    source_id: SRC-AGENTS
- acceptance_criteria:
  - Opiekun bez uprawnienia nie uzyskuje danych dziecka, wyników ani konsultacji.
  - Nauczyciel bez przypisania nie uzyskuje danych edukacyjnych grupy.
  - Uprawnienia metodyka, obsługi i administratorów są rozdzielone według obowiązków.
  description: Dostęp zależy od roli i uprawnienia do konkretnego dziecka, grupy lub
    sprawy.
  id: BR-014
  priority: MUST
  rationale: Chronić dane i rozdzielić obowiązki.
  source_refs:
  - locator: §22 Authorization
    source_id: SRC-AGENTS
  - locator: §8 Role
    source_id: SRC-PLAN
- acceptance_criteria:
  - Zmiany ocen i uprawnień, wyjątki progresji oraz wrażliwe operacje administracyjne
    identyfikują wykonawcę i działanie.
  - Usunięcie wiadomości nie usuwa śladu audytowego; audyt jest dostępny wyłącznie
    uprawnionym osobom.
  description: Ważne działania i komunikacja zachowują historię dostępną uprawnionemu
    audytowi.
  id: BR-015
  priority: MUST
  rationale: Zapewnić rozliczalność decyzji.
  source_refs:
  - locator: §21 Learning progression; §23 Security and Privacy
    source_id: SRC-AGENTS
  - locator: §10 Standard komunikacji
    source_id: SRC-PLAN
- acceptance_criteria:
  - Opiekun otrzymuje potwierdzenie zakupu i informacje potrzebne do udziału.
  - Program określa komunikaty organizacyjne i dotyczące ocen; kanałem transakcyjnym
    MVP jest e-mail.
  - Po decyzji organizatora platforma niezwłocznie informuje uczestnika i opiekuna
    o zmianie terminu, odwołaniu lub istotnej zmianie organizacyjnej zajęć.
  - Wymaganie niezwłocznego powiadomienia nie ustanawia dodatkowego globalnego gwarantowanego
    SLA czasowego MVP.
  description: Rodzina otrzymuje informacje związane z zakupem i realizacją udziału
    oraz zmianami zajęć.
  id: BR-016
  priority: MUST
  rationale: Zapewnić dostęp do informacji organizacyjnych.
  source_refs:
  - locator: §9 MVP; §18 Must have; Ostateczne rozstrzygnięcie brakujących decyzji
      biznesowych — Q-016, §10
    source_id: SRC-PLAN
  - locator: Część A §13
    source_id: SRC-PROGRAM
  - locator: §3 MVP Scope
    source_id: SRC-AGENTS
- acceptance_criteria:
  - Program wskazuje przedmiot, grupę docelową, strukturę, moduły, cele, efekty i
    wymagania wejściowe.
  - Liczba i długość zajęć, limity grupy i okres dostępu są konfigurowalne bez globalnej
    klasy, wieku lub czterech lekcji.
  - Program określa zasady oceniania, ukończenia i progresji.
  - Kontrola treści obejmuje zgodność ocen z efektami, dostosowania oraz legalność
    materiałów; przykładowe podpisy szablonu nie zatwierdzają BA.
  description: Nauczyciel tworzy, wersjonuje i publikuje konfigurowalny program z
    kontrolą jakości treści.
  id: BR-017
  priority: MUST
  rationale: Obsłużyć różne przedmioty i grupy bez globalizacji przykładu.
  source_refs:
  - locator: §2 Product Goal; §21 Assessment rules; Versioning
    source_id: SRC-AGENTS
  - locator: Część A §§1, 12, 15
    source_id: SRC-PROGRAM
- acceptance_criteria:
  - Sprzedaż MVP odbywa się w PLN; obsługa innych walut pozostaje poza zakresem.
  - Pełna cena brutto wraz z walutą jest widoczna przed zakupem; cena programu, modułu
    lub innego sprzedawanego elementu jest konfigurowalna i nie jest stałą globalną.
  - Odwołanie grupy przez organizatora umożliwia wybór pełnego zwrotu albo innej grupy.
  - Nieobecność dziecka nie powoduje automatycznego zwrotu.
  - Pogarszająca sytuację uczestnika zmiana istotnych warunków zakupionego programu
    wymaga akceptacji opiekuna.
  - Przy braku akceptacji takiej zmiany i niemożności wykonania usługi na pierwotnych
    warunkach opiekun wybiera odpowiednią alternatywną grupę lub program albo pełny
    zwrot niewykorzystanej części świadczenia.
  - Podatki, dokumenty sprzedaży i szczegółowe warunki konsumenckie są potwierdzone
    przed sprzedażą; nie przyjęto uniwersalnego VAT.
  - Wszystkie poprawki egzaminów pozostają bezpłatne.
  description: Sprzedaż MVP w PLN przedstawia konfigurowalną pełną cenę brutto i respektuje
    zasady zwrotów oraz zmian warunków po zakupie.
  id: BR-018
  priority: MUST
  rationale: Określić zobowiązania wobec kupującego.
  source_refs:
  - locator: §21 Money; Retakes
    source_id: SRC-AGENTS
  - locator: Wprowadzenie; §11; Ostateczne rozstrzygnięcie brakujących decyzji biznesowych
      — Q-016, §§2 i 8; historyczne warianty zwrotów zachowane w odpowiedziach Q-004
      i Q-009
    source_id: SRC-PLAN
- acceptance_criteria:
  - Zbierane i przechowywane są wyłącznie dane potrzebne do celów usługi.
  - Zajęcia nie są domyślnie nagrywane; nagrywanie pozostaje poza MVP i wymaga osobnej
    decyzji biznesowej oraz prawnej.
  - Polityki retencji, usuwania i anonimizacji można konfigurować; podstawy, zgody,
    okresy, wyjątki, prawa osób i wymagania wobec procesorów są ustalone przed produkcją.
  - Opiekun może zgłosić eksport lub usunięcie danych w odpowiednim zakresie; publiczne
    profile dzieci i reklama profilowana pozostają poza zakresem.
  description: Dane są minimalizowane, a retencja, usuwanie i anonimizacja podlegają
    konfigurowalnym politykom.
  id: BR-019
  priority: MUST
  rationale: Ograniczyć przetwarzanie danych dzieci i umożliwić wykonanie ich praw.
  source_refs:
  - locator: §8 Panel rodzica; §11; §18 Świadomie poza MVP; Potwierdzenie wcześniejszych
      decyzji biznesowych — Q-015 / Q-007
    source_id: SRC-PLAN
  - locator: §23 Security and Privacy
    source_id: SRC-AGENTS
- acceptance_criteria:
  - Przed dopuszczeniem nauczyciela do kontaktu z dziećmi organizator zapewnia wymagane
    prawem weryfikacje i dokumenty, zapoznanie ze standardami ochrony małoletnich,
    akceptację zasad komunikacji oraz wymagane szkolenia dotyczące bezpieczeństwa
    i ochrony małoletnich.
  - Dokładny zakres weryfikacji, dokumentów i szkoleń wynika z prawa oraz procedur
    organizacji i jest zatwierdzony przed rozpoczęciem świadczenia usługi.
  - Kontakt związany z usługą odbywa się przez kanały udostępnione lub zatwierdzone
    przez platformę; dzieci nie są kierowane do prywatnych kont nauczycieli.
  - Można zgłosić nieodpowiednie zachowanie.
  - Przed usługą istnieje wymagana procedura ochrony małoletnich; wymagana prawem
    osoba lub funkcja jest wyznaczona przed pilotem lub usługą.
  description: Kontakt nauczyciela z dziećmi wymaga weryfikacji, dokumentów, szkoleń
    i procedur ochrony małoletnich.
  id: BR-020
  priority: MUST
  rationale: Zapewnić organizacyjne warunki bezpieczeństwa.
  source_refs:
  - locator: §10 Rekrutacja nauczycieli; §11; Ostateczne rozstrzygnięcie brakujących
      decyzji biznesowych — Q-016, §12; zachowany dowód Q-010
    source_id: SRC-PLAN
  - locator: §21 Consultations
    source_id: SRC-AGENTS
- acceptance_criteria:
  - Brak nauczyciela prowadzi do zastępstwa albo nowego terminu; awaria uniemożliwiająca
    lekcję prowadzi do przełożenia zajęć.
  - Poniżej skonfigurowanego minimum organizator może przesunąć start, zaproponować
    inną grupę albo zwrócić wpłatę.
  - Reklamacje i konflikty rozpatruje uprawniony administrator albo osoba wyznaczona
    przez organizatora.
  - Finalne SLA reklamacji, ręcznej oceny, zmian i administracji są określone przed
    produkcją; przykładowy czas z szablonu nie jest globalnym SLA.
  description: Organizator obsługuje zakłócenia, grupy poniżej minimum i reklamacje.
  id: BR-021
  priority: MUST
  rationale: Zapewnić decyzję w sytuacji wyjątkowej.
  source_refs:
  - locator: Potwierdzenie wcześniejszych decyzji biznesowych — Q-015 / Q-009; §12
      SLA do ustalenia
    source_id: SRC-PLAN
- acceptance_criteria:
  - Uczeń widzi następne działanie i zrozumiałe komunikaty; podstawowe przepływy działają
    na telefonie, tablecie i komputerze.
  - Dostosowania zachowują mierzoną umiejętność, a ocena dostępności odnosi się do
    celu WCAG 2.2 AA.
  description: Interfejs jest czytelny i dostosowany do wieku, urządzenia oraz potrzeb
    edukacyjnych.
  id: BR-022
  priority: MUST
  rationale: Ułatwić samodzielną realizację nauki.
  source_refs:
  - locator: §24 UI and Accessibility
    source_id: SRC-AGENTS
  - locator: Część A §11
    source_id: SRC-PROGRAM
  - locator: §9 Wymagania jakościowe
    source_id: SRC-PLAN
- acceptance_criteria:
  - Uczeń odczytuje wzory i podaje przewidziany typ odpowiedzi; dopuszczone odpowiedzi
    równoważne są oceniane według kryteriów zadania.
  - Klucz egzaminu nie jest udostępniony przed zakończeniem oceny i uprawnionym przeglądem.
  description: Treści matematyczne i odpowiedzi są prezentowane oraz oceniane według
    kryteriów zadania.
  id: BR-023
  priority: MUST
  rationale: Oceniać umiejętność, a nie wyłącznie zgodność tekstową.
  source_refs:
  - locator: §9 Matematyka i zaawansowane równania
    source_id: SRC-PLAN
  - locator: §24 UI and Accessibility
    source_id: SRC-AGENTS
- acceptance_criteria:
  - Co najmniej 70% uczestników rozpoczynających moduł lub program kończy go przez
    spełnienie wszystkich kryteriów ukończenia skonfigurowanych dla ich wersji programu.
  - Co najmniej 60% klientów kwalifikujących się do kontynuacji kupuje kolejny płatny
    moduł lub program w ciągu 60 dni.
  - Klient kwalifikuje się do kontynuacji, gdy jego dziecko posiada aktywne lub zakończone
    uczestnictwo, spełniło skonfigurowane warunki rozpoczęcia kolejnego płatnego etapu
    i ma dostępny kolejny płatny etap lub program będący logiczną kontynuacją.
  - Okno 60 dni rozpoczyna się, kiedy uczestnik po raz pierwszy spełni wszystkie warunki
    umożliwiające zakup tej kontynuacji.
  - Średnia frekwencja pilota wynosi co najmniej 80% i jest ilorazem łącznej liczby
    obecności uczestników oraz łącznej liczby zaplanowanych obecności uczestników.
  - Frekwencja uczestnika jest ilorazem zajęć live z jego udziałem i zaplanowanych
    dla niego zajęć live; mianownik obejmuje wyłącznie zajęcia, które faktycznie powinny
    się odbyć, a zajęcia odwołane przez organizatora i przełożone nie są liczone jako
    nieobecność.
  - Ankieta satysfakcji jest wysyłana po zakończeniu mierzonego programu lub modułu;
    podstawową grupą badaną są opiekunowie uczestników, którzy go rozpoczęli.
  - Średnia satysfakcja wynosi co najmniej 4,2 w skali 1–5; raport zawiera średnią,
    liczbę wysłanych ankiet, liczbę odpowiedzi i response rate.
  - Marża i budżet walidacji są określone przed ekonomiczną oceną pilota.
  description: Pilot jest oceniany według ukończeń, kontynuacji, frekwencji, satysfakcji
    i rentowności.
  id: BR-024
  priority: MUST
  rationale: Oprzeć rozwój na wynikach pilota.
  source_refs:
  - locator: §14; Ostateczne rozstrzygnięcie brakujących decyzji biznesowych — Q-016,
      §§3–6; zachowane cele i odroczenie ekonomiczne w odpowiedzi Q-012
    source_id: SRC-PLAN
- acceptance_criteria:
  - Ocena zakresu MVP obejmuje do 100 aktywnych rodzin i do 10 równoczesnych lekcji.
  - Aktywna rodzina posiada co najmniej jedno dziecko z aktywnym dostępem do trwającego
    lub opłaconego programu w danym miesiącu.
  - Jedne prowadzone na żywo zajęcia lub grupa stanowią jedną równoczesną lekcję niezależnie
    od liczby uczestników.
  - Rozwój co najmniej do 10 000 rodzin i 200 równoczesnych lekcji nie wymaga zmiany
    podstawowego modelu domenowego, głównych publicznych kontraktów między obszarami
    ani przepisania większości aplikacji.
  - Cele podlegają ponownej ocenie przed dalszym skalowaniem; skala rozwoju nie oznacza
    zakresu pilota.
  description: MVP obsługuje do 100 aktywnych rodzin i 10 równoczesnych lekcji oraz
    umożliwia rozwój co najmniej do 10 000 rodzin i 200 lekcji.
  id: BR-025
  priority: MUST
  rationale: Określić obciążenie pilota i biznesową granicę rozwoju.
  source_refs:
  - locator: Potwierdzenie wcześniejszych decyzji biznesowych — Q-015 / Q-011 i Q-014
    source_id: SRC-PLAN
- acceptance_criteria:
  - Dostępność podstawowych funkcji produkcyjnych wynosi co najmniej 99,5% miesięcznie.
  - Zakres obejmuje w szczególności logowanie i uwierzytelnienie, panel uczestnika
    i opiekuna, dostęp do zakupionych programów i materiałów, obsługę uczestnictwa,
    harmonogram i informacje o zajęciach, ocenianie i progresję, konsultacje oraz
    podstawowe funkcje nauczyciela potrzebne do prowadzenia aktywnych programów.
  - Awaria jednej z tych funkcji uniemożliwiająca podstawowy proces użytkownika jest
    traktowana jako niedostępność odpowiedniej części usługi.
  - Zapowiedziane prace serwisowe są wyłączone z celu tylko po poinformowaniu użytkowników
    co najmniej 24 godziny wcześniej.
  - Maksymalna dopuszczalna utrata trwałych danych biznesowych względem dostępnego
    punktu odtworzenia nie przekracza 24 godzin.
  - Czas od potwierdzenia awarii krytycznej funkcji produkcyjnej do przywrócenia działania
    nie przekracza czterech godzin.
  - Cele MVP podlegają ponownej ocenie przed dalszym skalowaniem.
  description: MVP realizuje cele 99,5% miesięcznej dostępności, RPO do 24 godzin
    i RTO do czterech godzin.
  id: BR-026
  priority: MUST
  rationale: Ograniczyć przerwy usługi i utratę danych biznesowych.
  source_refs:
  - locator: Ostateczne rozstrzygnięcie brakujących decyzji biznesowych — Q-016, §7;
      zachowane cele odtworzenia i ponownej oceny w odpowiedziach Q-011 i Q-014
    source_id: SRC-PLAN
business_rules:
- description: Opiekun główny kontroluje dodawanie i odbieranie dodatkowego dostępu;
    dziecko nie zarządza opiekunami, płatnościami ani zgodami osoby dorosłej.
  id: RULE-001
  source_refs:
  - locator: Potwierdzenie wcześniejszych decyzji biznesowych — Q-015 / Q-003
    source_id: SRC-PLAN
- description: Prerequisite dotyczy rozpoczęcia, nie zakupu. Finalne zaliczenie albo
    wyjątek przyznany przez nauczyciela będącego właścicielem programu, administratora
    lub Michała Wanielistę usuwa odpowiednią blokadę. Sama rola metodyka nie daje
    automatycznie prawa wyjątku. Audyt zawiera osobę, czas i powód; brak globalnego
    obowiązku zaliczenia.
  id: RULE-002
  source_refs:
  - locator: Ostateczne rozstrzygnięcie brakujących decyzji biznesowych — Q-016, §§1
      i 13; §5 Ważna korekta procesu sprzedaży w zakresie rozdzielenia zakupu i rozpoczęcia
    source_id: SRC-PLAN
  - locator: §21 Learning progression; Manual grading
    source_id: SRC-AGENTS
- description: Wynik wstępny nie odblokowuje progresji wymagającej zatwierdzonego
    zaliczenia, a próba zachowuje wersje podstawy oceny.
  id: RULE-003
  source_refs:
  - locator: §21 Versioning; Manual grading
    source_id: SRC-AGENTS
- description: Wszystkie poprawki są bezpłatne; starsza cena 100 PLN netto i model
    płatnych dalszych prób są wycofane.
  id: RULE-004
  source_refs:
  - locator: §21 Retakes
    source_id: SRC-AGENTS
- description: Sprzedaż MVP odbywa się wyłącznie w PLN. Ceny sprzedawanych elementów
    są konfigurowalne, kwota posiada walutę i pełna cena brutto jest znana przed zakupem.
    VAT nie jest globalnie stały; inne waluty pozostają poza MVP.
  id: RULE-005
  source_refs:
  - locator: Ostateczne rozstrzygnięcie brakujących decyzji biznesowych — Q-016, §2
    source_id: SRC-PLAN
  - locator: §21 Money; Retakes
    source_id: SRC-AGENTS
- description: Powtórne potwierdzenie płatności nie powiela płatności, zapisów ani
    operacji biznesowych.
  id: RULE-006
  source_refs:
  - locator: §21 Payments
    source_id: SRC-AGENTS
- description: Dziecko i opiekunowie dzielą jeden nowy wątek tygodniowo na aktywny
    program; odpowiedź następuje do dwóch polskich dni roboczych, bez przenoszenia
    limitu i bez naliczania odpowiedzi jako nowych wątków.
  id: RULE-007
  source_refs:
  - locator: Potwierdzenie wcześniejszych decyzji biznesowych — Q-015 / Q-006
    source_id: SRC-PLAN
- description: Dostęp wymaga właściwej roli i uprawnienia do konkretnego zasobu.
  id: RULE-008
  source_refs:
  - locator: §22 Authorization
    source_id: SRC-AGENTS
- description: Nie obiecuje się gwarantowanej oceny szkolnej ani zdania egzaminu państwowego;
    niezaliczenia nie premiują przychodów.
  id: RULE-009
  source_refs:
  - locator: §4 Pozycjonowanie marki; §5 Ważna korekta procesu sprzedaży
    source_id: SRC-PLAN
  - locator: §21 Retakes
    source_id: SRC-AGENTS
- description: Dostosowania zachowują mierzoną umiejętność; materiały wymagają podstawy
    legalnego wykorzystania.
  id: RULE-010
  source_refs:
  - locator: Część A §§11–12, 15
    source_id: SRC-PROGRAM
- description: Nauczyciel konfiguruje program; cztery lekcje, konkretna klasa i wielkość
    grupy z przykładów nie ograniczają platformy.
  id: RULE-011
  source_refs:
  - locator: §2 Product Goal
    source_id: SRC-AGENTS
- description: Nieopłacona rezerwacja wygasa po 24 godzinach; późna płatność nie gwarantuje
    miejsca i wymaga rozpoznania dostępności, innej grupy albo zwrotu.
  id: RULE-012
  source_refs:
  - locator: Potwierdzenie wcześniejszych decyzji biznesowych — Q-015 / Q-004
    source_id: SRC-PLAN
- description: Nieobecność dziecka nie powoduje automatycznego zwrotu; brak nauczyciela
    wymaga zastępstwa albo nowego terminu, a awaria uniemożliwiająca lekcję powoduje
    jej przełożenie.
  id: RULE-013
  source_refs:
  - locator: Potwierdzenie wcześniejszych decyzji biznesowych — Q-015 / Q-009
    source_id: SRC-PLAN
- description: Nagrywanie pozostaje poza MVP i wymaga osobnej decyzji biznesowej oraz
    prawnej; lekcje nie są domyślnie nagrywane.
  id: RULE-014
  source_refs:
  - locator: Potwierdzenie wcześniejszych decyzji biznesowych — Q-015 / Q-007
    source_id: SRC-PLAN
constraints:
- description: Zakres MVP wyznacza AGENTS §3; opcjonalne produkty z planu nie rozszerzają
    go automatycznie.
  id: CON-001
  source_refs:
  - locator: §3 MVP Scope
    source_id: SRC-AGENTS
- description: Aktualne AGENTS i bezpośrednia decyzja właściciela Q-016 zastępują
    sprzeczne starsze reguły, przykłady i wygenerowaną BA w swoim zakresie, w tym
    globalne cztery lekcje, obowiązkowy egzamin, globalną progresję, płatne poprawki
    i automatyczne uprawnienie metodyka do wyjątków. Pusty rejestr decyzji nie ustanawia
    dodatkowych rozstrzygnięć.
  id: CON-002
  source_refs:
  - locator: §1A; §2; §21
    source_id: SRC-AGENTS
  - locator: Ostateczne rozstrzygnięcie brakujących decyzji biznesowych — Q-016, §§1–4
      i 13
    source_id: SRC-PLAN
  - locator: 'decisions: []'
    source_id: SRC-DECISIONS
- description: Mandaty techniczne i Accepted ADR są istniejącymi ograniczeniami projektu;
    BA ich nie zmienia i nie wybiera sposobu realizacji technicznej.
  id: CON-003
  source_refs:
  - locator: §§4, 16, 21–25
    source_id: SRC-AGENTS
  - locator: Responsibilities and boundaries
    source_id: SRC-ROLE
- description: Baseline SR-01–SR-15 nie jest zatwierdzonym BA ani SA. Zachowano jego
    identyfikatory i linki; starsze SR-03, SR-04 i SR-05 wymagają przeglądu wpływu
    względem aktualnej konfigurowalności i bezpłatnych poprawek.
  id: CON-004
  source_refs:
  - locator: Status; SR-03; SR-04; SR-05
    source_id: SRC-BASELINE
  - locator: Revision, approval and traceability policy
    source_id: SRC-CONTRACT
- description: Tylko Michał Wanielista zatwierdza dokładną rewizję przez mechanizm
    kontrolera. approved_ba_evidence jest null; potwierdzenie decyzji źródłowych nie
    jest aprobatą dokładnych bajtów BA.
  id: CON-005
  source_refs:
  - locator: §1A Business Ownership and Decision Authority
    source_id: SRC-AGENTS
  - locator: Factory external approval evidence
    source_id: SRC-CONTRACT
- description: Dane i retencja oraz SLA są bramkami produkcji; warunki konsumenckie
    i podatki bramką sprzedaży; ochrona małoletnich bramką usługi z wymaganym wyznaczeniem
    funkcji przed pilotem. Marża i budżet są bramką ekonomicznej oceny pilota, bez
    przenoszenia biznesowej aprobaty na konsultantów.
  id: CON-006
  source_refs:
  - locator: Wprowadzenie; §11; Potwierdzenie wcześniejszych decyzji biznesowych —
      Q-015 / Q-003, Q-004, Q-007, Q-009, Q-010 i Q-012
    source_id: SRC-PLAN
  - locator: §1A
    source_id: SRC-AGENTS
- description: Historyczna BA nie stanowi samodzielnej decyzji biznesowej. Aktualna
    bezpośrednia decyzja właściciela rozstrzyga Q-016 bez odzyskiwania historycznej
    sekcji Q-001–Q-014. W jej zakresie historyczne ustalenia niewymienione jako obowiązujące
    nie tworzą samodzielnych wymagań. Zachowano rzeczywiste wcześniejsze odpowiedzi
    i ich dowody; usunięcie sekcji potwierdzenia Q-015 z bieżącego planu nie jest
    samo w sobie dowodem odwołania wszystkich wcześniejszych decyzji.
  id: CON-007
  source_refs:
  - locator: Ostateczne rozstrzygnięcie brakujących decyzji biznesowych — Q-016, §13
    source_id: SRC-PLAN
  - locator: Responsibilities and boundaries; Incremental factory mode
    source_id: SRC-ROLE
glossary:
- description: Etap programu z celami i efektami oraz liczbą i długością zajęć określonymi
    przez nauczyciela.
  id: TERM-001
  source_refs:
  - locator: §2 Product Goal
    source_id: SRC-AGENTS
  term: Module
- description: Wersja programu określająca strukturę, treści, cele, ocenianie i reguły
    realizacji.
  id: TERM-002
  source_refs:
  - locator: Część A §§1–10
    source_id: SRC-PROGRAM
  - locator: §21 Versioning
    source_id: SRC-AGENTS
  term: ProgramVersion
- description: Konkretna edycja udziału z nauczycielem i harmonogramem, odrębna od
    definicji modułu.
  id: TERM-003
  source_refs:
  - locator: §21 Educational module model
    source_id: SRC-AGENTS
  term: ScheduledGroup
- description: Udział uczestnika w konkretnej grupie, odrębny od programu i płatności.
  id: TERM-004
  source_refs:
  - locator: §21 Educational module model; Payments
    source_id: SRC-AGENTS
  term: Enrollment
- description: Obserwowalna umiejętność z kryterium sukcesu i sposobem weryfikacji.
  id: TERM-005
  source_refs:
  - locator: Część A §4
    source_id: SRC-PROGRAM
  term: LearningOutcome
- description: Wynik oczekujący wymaganej oceny, niewystarczający do spełnienia warunku
    zatwierdzonego zaliczenia.
  id: TERM-006
  source_refs:
  - locator: §21 Manual grading
    source_id: SRC-AGENTS
  term: PreliminaryResult
- description: Wynik po zakończeniu wymaganej oceny według zachowanej podstawy oceniania.
  id: TERM-007
  source_refs:
  - locator: §21 Manual grading; Versioning
    source_id: SRC-AGENTS
  term: FinalApprovedResult
- description: Bezpłatna ponowna próba egzaminu zgodna z zasadami programu.
  id: TERM-008
  source_refs:
  - locator: §21 Retakes; Assessment rules
    source_id: SRC-AGENTS
  term: Retake
- description: Ograniczony asynchroniczny wątek edukacyjny rozpoczynany w platformie
    podczas aktywnego dostępu do programu.
  id: TERM-009
  source_refs:
