actors:
- description: Opiekun zarządza udziałem, zakupami i zgodami; opiekun główny potwierdza
    dodatkowych opiekunów i może odebrać im dostęp.
  id: ACT-001
  source_refs:
  - locator: Potwierdzenie wcześniejszych decyzji biznesowych — Q-015 / Q-003
    source_id: SRC-PLAN
  - locator: §21 Parent responsibility
    source_id: SRC-AGENTS
- description: Dziecko posiada własny dostęp do panelu ucznia; nie zarządza opiekunami,
    płatnościami ani zgodami wymagającymi osoby dorosłej.
  id: ACT-002
  source_refs:
  - locator: Potwierdzenie wcześniejszych decyzji biznesowych — Q-015 / Q-003
    source_id: SRC-PLAN
- description: Nauczyciel tworzy i publikuje program, prowadzi przypisane grupy, ocenia
    i konsultuje. Wyjątek od progresji może przyznać nauczyciel będący właścicielem
    danego programu; uprawniony nauczyciel może ręcznie weryfikować podejrzenie niesamodzielności.
  id: ACT-003
  source_refs:
  - locator: §2 Product Goal; §22 Authorization
    source_id: SRC-AGENTS
  - locator: Ostateczne rozstrzygnięcie brakujących decyzji biznesowych — Q-016, §§1
      i 9
    source_id: SRC-PLAN
- description: Metodyk wspiera jakość programu i oceniania. Sama rola metodyka nie
    daje automatycznie prawa przyznawania wyjątków progresji ani zatwierdzania BA
    lub SA.
  id: ACT-004
  source_refs:
  - locator: §8 Role; Ostateczne rozstrzygnięcie brakujących decyzji biznesowych —
      Q-016, §1
    source_id: SRC-PLAN
  - locator: §1A Business Ownership and Decision Authority
    source_id: SRC-AGENTS
- description: Obsługa klienta przyjmuje sprawy organizacyjne, reklamacje i rezygnacje,
    przekazując decyzję osobie uprawnionej.
  id: ACT-005
  source_refs:
  - locator: §8 Role; §12
    source_id: SRC-PLAN
- description: Administrator wykonuje operacje zgodnie z uprawnieniami, ręcznie weryfikuje
    odzyskanie dostępu opiekunów oraz może rozpatrywać reklamacje i przyznać audytowany
    wyjątek progresji.
  id: ACT-006
  source_refs:
  - locator: Potwierdzenie wcześniejszych decyzji biznesowych — Q-015 / Q-003 i Q-009
    source_id: SRC-PLAN
  - locator: §21 Learning progression; §22 Authorization
    source_id: SRC-AGENTS
- description: Administrator techniczny lub audytor korzysta z dostępu ograniczonego
    do swoich obowiązków.
  id: ACT-007
  source_refs:
  - locator: §8 Role
    source_id: SRC-PLAN
  - locator: §22 Authorization
    source_id: SRC-AGENTS
