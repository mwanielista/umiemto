scope: 'MVP eSzkola na rynku polskim: konta opiekunów, profile dzieci, zgody, konfigurowalne
  programy, katalog, grupy, zapisy, zakupy i płatności w PLN, harmonogram, zewnętrzne
  lekcje online, materiały, obecności, zadania, przesyłanie odpowiedzi, trening, opcjonalne
  egzaminy, bezpłatne kolejne próby, postęp, raporty, konsultacje asynchroniczne,
  administracja, powiadomienia e-mail, uprawnienia i audyt. Struktura, ocenianie,
  ukończenie i progresja należą do wersji programu. Poza MVP pozostają własne wideokonferencje,
  marketplace, aplikacje natywne, publiczne profile dzieci, otwarty czat społecznościowy,
  AI tutor, wiele walut i rozpoznawanie odręcznych równań. Pakiety, premium, B2B i
  wideokonsultacje 1:1 nie są obowiązkowym MVP. Analiza nie wybiera technologii, architektury,
  modeli danych ani API i nie tworzy zadań implementacyjnych.'
