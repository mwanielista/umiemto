revision: 5
status: BLOCKED
approval: null
scope: >-
  MVP eSzkola na rynku polskim: konta opiekunów, profile dzieci, zgody,
  konfigurowalne programy edukacyjne publikowane przez nauczycieli, katalog,
  grupy, zapisy, zamówienia, płatności, harmonogramy, zewnętrzne lekcje online,
  materiały, obecności, zadania, trening, oceny, bezpłatne poprawki,
  raporty, konsultacje, administracja treścią, e-mail i audyt.
  Przedmiot, grupa docelowa, struktura, liczba i długość zajęć, limity grupy,
  ocenianie, progresja i okres dostępu do materiałów należą do programu.
  Przykład matematyczny nie jest globalną regułą.
  Poza zakresem pozostają własne wideokonferencje, AI tutor, marketplace,
  aplikacje natywne, otwarty czat społecznościowy, premium, B2B, kupony,
  SMS i zaawansowana analityka. BA nie projektuje architektury, technologii,
  modeli danych, API ani zadań implementacyjnych.
  Nowe potwierdzenie w planie zamyka Q-015. Brak sekcji wcześniejszej
  aktualizacji decyzji, cytowanej w rewizji 4, pozostawia Q-016.
