  question: Jakie są jednostka limitu konsultacji, kalendarz i uprawnienia do zamknięcia?
  resolution:
    answer: Jeden nowy wątek jest wspólnym limitem dziecka i opiekunów na aktywny
      program w tygodniu poniedziałek 00:00–niedziela 23:59 Europe/Warsaw. Limit nie
      przechodzi dalej; odpowiedzi go nie zużywają. Nauczyciel odpowiada do dwóch
      dni roboczych poza polskimi świętami ustawowymi. Nauczyciel lub administrator
      zamyka zakończony wątek i moderuje. Nowe wątki są dostępne podczas aktywnego
      dostępu do programu; przykładowe okna 24 lub 48 godzin nie są globalną regułą.
      Historyczna odpowiedź została bezpośrednio potwierdzona.
