  question: Jak działa rezerwacja, późna płatność, brak prerequisite i odwołanie grupy?
  resolution:
    answer: Rezerwacja trwa 24 godziny od zamówienia. Późna płatność nie gwarantuje
      miejsca; możliwe jest dostępne miejsce, inna grupa albo pełny zwrot przy braku
      odpowiedniej grupy. Brak prerequisite umożliwia późniejszą grupę, przyszłą edycję
      albo zwrot. Odwołanie przez organizatora daje opiekunowi wybór pełnego zwrotu
      albo innej grupy. Warunki konsumenckie pozostają bramką sprzedaży Q-008, jawnie
      nie blokując SA. Wcześniejsza odpowiedź historyczna otrzymała bezpośrednie potwierdzenie.
    evidence: 'SRC-PLAN sha256:daf77f5364f1f5de20752d365f3f1aba976eaa45151b3d76515d6d2f3b8e6afc,
