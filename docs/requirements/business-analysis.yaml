      właściciel biznesowy może przyznać audytowany wyjątek. Rewizja 4 wskazywała
      dodatkowo wymóg nauczyciela będącego właścicielem programu i brak samodzielnego
      uprawnienia metodyka; aktualne AGENTS nie rozstrzyga tych szczegółów, a starszy
      plan wymienia decyzję metodyka. Zachowano ten historyczny zapis do rozstrzygnięcia
