  id: Q-016
  owner: Michał Wanielista
  question: 'Czy właściciel dostarczy brakującą sekcję Aktualizacja decyzji biznesowych
    Q-001–Q-014 cytowaną w rewizji 4 albo bezpośrednio rozstrzygnie niepokryte szczegóły?
    Bieżący plan zawiera bazowy plan i nowe potwierdzenie Q-015, ale nie tę sekcję.
    AGENTS samodzielnie potwierdza własność biznesową, konfigurowalność, progresję
    i bezpłatne poprawki. Nie rozstrzyga jednak: czy wyjątek nauczyciela wymaga własności
    programu i czy sama rola metodyka może nadać takie uprawnienie, czy MVP sprzedaje
    wyłącznie w PLN, jak definiować klienta kwalifikującego się do kontynuacji i początek
    60-dniowego okna, jak wyznaczyć ukończenie bez egzaminu lub dodatkowych kryteriów,
    agregację frekwencji i moment ankiety oraz dokładny zakres podstawowych funkcji
    objętych dostępnością. Rewizja 4 zachowywała też pełny zwrot po niezaakceptowanej
    zmianie, wstrzymanie wyniku przy podejrzeniu niesamodzielności, niezwłoczną informację
    o zmianie zajęć, oświadczenie pełnoletności i uprawnienia opiekuna oraz szczegółowe
    szkolenia nauczyciela. Nowe potwierdzenie tych szczegółów nie wymienia wprost,
    mimo ogólnego odwołania do zachowanych wcześniejszych decyzji. Czy pozostają wiążące,
    są zmienione, czy wycofane? BLOCKER jest konieczny, ponieważ niejednoznaczność
    dotyczy uprawnień, zobowiązań wobec klienta oraz mierzalności KPI i celów ciągłości;
    BA nie może wybrać znaczenia ogólnego potwierdzenia zamiast właściciela. Nie wymaga
    się odzyskiwania historycznych plików dla już bezpośrednio potwierdzonych decyzji
    Q-015.'
  resolution:
    answer: Michał Wanielista bezpośrednio rozstrzygnął wszystkie zagadnienia objęte
      Q-016. Wyjątek progresji przyznaje nauczyciel będący właścicielem programu,
      administrator lub właściciel biznesowy; sama rola metodyka nie daje automatycznie
      tego prawa, a audyt obejmuje osobę, czas i powód. Sprzedaż MVP odbywa się w
      PLN przy konfigurowalnych cenach i bezpłatnych poprawkach. Określono kwalifikację
      do kontynuacji i początek 60-dniowego okna, ukończenie według wszystkich kryteriów
      wersji programu bez globalnego egzaminu, agregację frekwencji i wyłączenie odwołanych
      lub przełożonych zajęć z nieobecności oraz ankietę po zakończeniu dla opiekunów
      uczestników, którzy rozpoczęli program. Wskazano funkcje objęte celem 99,5%
      i znaczenie ich awarii. Pogarszająca zmiana istotnych warunków wymaga akceptacji;
      przy jej braku i niemożności realizacji pierwotnych warunków dostępna jest alternatywa
      lub pełny zwrot niewykorzystanej części świadczenia. Podejrzenie niesamodzielności
      wstrzymuje finalne zatwierdzenie do ręcznej weryfikacji z audytem uzasadnienia.
      Zmiany zajęć wymagają niezwłocznej informacji bez dodatkowego globalnego SLA.
      Opiekun składa określone oświadczenia, a nauczyciel spełnia wymagania prawne
      i szkoleniowe przed usługą. Szczegóły prawne pozostają bramkami sprzedaży, produkcji
      lub usługi. Właściciel nie wymaga odzyskania historycznej sekcji; niewymienione
      historyczne ustalenia w rozstrzygniętym zakresie nie są samodzielnymi wymaganiami.
      Decyzja źródłowa nie zatwierdza dokładnej rewizji BA.
    evidence: SRC-PLAN, docs/biznesplan-platforma-kursy-dla-dzieci.md, sha256:8432060b9619b6afb0ba1326d2877f0a492dbe194f5d082bb85290f99c7e068b,
      Ostateczne rozstrzygnięcie brakujących decyzji biznesowych — Q-016, wstęp oraz
      §§1–13, w szczególności jawne polecenie oznaczenia Q-016 jako RESOLVED w §13.
      Tekst i digest dostarczone w changed_sources kontrolera.
  severity: BLOCKER
  status: RESOLVED
processes:
- actor_refs:
  - ACT-001
  - ACT-002
  - ACT-005
  - ACT-006
  description: Wybór programu, zakup miejsca i rozpoczęcie udziału.
  id: PROC-001
  source_refs:
  - locator: §12 Proces sprzedażowy; Potwierdzenie wcześniejszych decyzji biznesowych
      — Q-015 / Q-004
    source_id: SRC-PLAN
  - locator: §21 Learning progression; Payments
    source_id: SRC-AGENTS
  steps:
  - Opiekun zakłada konto i profil dziecka oraz poznaje ofertę, wymagania wejściowe
    i cenę brutto.
  - Utworzenie zamówienia rozpoczyna 24-godzinną rezerwację miejsca.
  - Skuteczna płatność potwierdza udział bez powielania operacji; brak płatności przez
    24 godziny wygasza rezerwację.
  - Późna płatność pozwala przypisać dostępne miejsce albo zaproponować inną grupę;
    brak odpowiedniej grupy umożliwia pełny zwrot.
  - Rozpoczęcie następnika wymaga spełnienia skonfigurowanego prerequisite albo uprawnionego
    audytowanego wyjątku.
  - Niespełnienie prerequisite umożliwia późniejszą grupę, wykorzystanie płatności
    na przyszłą edycję albo zwrot według potwierdzonych zasad.
- actor_refs:
  - ACT-002
  - ACT-003
  - ACT-004
  - ACT-001
  - ACT-006
  description: Nauka, ocenianie i kontynuacja według wersji programu.
  id: PROC-002
  source_refs:
  - locator: §2 Product Goal; §21 Learning progression; Retakes; Manual grading
    source_id: SRC-AGENTS
  - locator: Część A §§3–10, 13
    source_id: SRC-PROGRAM
  steps:
  - Uczeń realizuje diagnozę lub warunki wejściowe, lekcje, materiały, prace i trening
    przewidziane w programie.
  - Realizuje przewidzianą ocenę lub warunek ukończenia.
  - Ocena wymagająca ręcznego sprawdzenia pozostaje wstępna do zatwierdzenia i nie
    odblokowuje progresji wymagającej zaliczenia.
  - Uczeń i opiekun otrzymują informację zwrotną oraz rekomendację.
  - Finalne zaliczenie, także bezpłatnej poprawki, albo uprawniony audytowany wyjątek
    usuwa odpowiednią blokadę.
  - Brak skonfigurowanego warunku zaliczenia oznacza brak takiej globalnej blokady
    kontynuacji.
- actor_refs:
  - ACT-001
  - ACT-002
  - ACT-003
  - ACT-006
  description: Ograniczona konsultacja asynchroniczna.
  id: PROC-003
  source_refs:
  - locator: Potwierdzenie wcześniejszych decyzji biznesowych — Q-015 / Q-006 i Q-007
    source_id: SRC-PLAN
  - locator: §21 Consultations
    source_id: SRC-AGENTS
  steps:
  - Dziecko lub opiekun rozpoczyna w platformie wątek dotyczący aktywnego programu
    w ramach wspólnego tygodniowego limitu.
  - Nauczyciel odpowiada w ciągu najwyżej dwóch dni roboczych.
  - Odpowiedzi w istniejącym wątku nie zużywają kolejnego limitu.
  - Nauczyciel lub administrator zamyka zakończony wątek albo moderuje naruszenia
    zasad.
  - Wątek jest archiwizowany i widoczny uprawnionemu opiekunowi zgodnie z polityką
    dostępu i retencji.
- actor_refs:
  - ACT-003
  - ACT-004
  - ACT-006
  description: Przygotowanie i publikacja programu.
  id: PROC-004
  source_refs:
  - locator: §2 Product Goal; §21 Assessment rules; Versioning
    source_id: SRC-AGENTS
  - locator: Część A §§1–15
    source_id: SRC-PROGRAM
  steps:
  - Nauczyciel określa przedmiot, grupę docelową, wymagania wejściowe, strukturę,
    cele i efekty.
  - Określa moduły, liczbę i długość zajęć, limity grupy, okres dostępu oraz reguły
    oceniania i progresji.
  - Treści podlegają kontroli jakości, dostosowań i legalności materiałów; recenzja
    programu nie zatwierdza BA.
  - Nauczyciel publikuje wersję programu.
  - Późniejsze zmiany nie zmieniają historycznej podstawy oceniania wykonanych prób.
- actor_refs:
  - ACT-001
  - ACT-002
  - ACT-003
  - ACT-005
  - ACT-006
  description: Obsługa zakłóceń, reklamacji i incydentów.
  id: PROC-005
  source_refs:
  - locator: Potwierdzenie wcześniejszych decyzji biznesowych — Q-015 / Q-009 i Q-010
    source_id: SRC-PLAN
  - locator: §23 Security and Privacy
    source_id: SRC-AGENTS
  steps:
  - Uprawniona osoba przyjmuje zgłoszenie i ustala rodzaj sprawy.
  - Nieobecność nauczyciela prowadzi do zastępstwa albo nowego terminu; awaria uniemożliwiająca
    lekcję prowadzi do przełożenia.
  - Grupa poniżej minimum może otrzymać późniejszy start, inną grupę albo zwrot wpłaty.
  - Reklamację lub konflikt rozpatruje uprawniony administrator albo osoba wyznaczona
    przez organizatora.
  - Zgłoszenie zagrożenia dziecka podlega procedurze ochrony małoletnich ustanowionej
    przed usługą.
  - Ważne działania pozostawiają ślad audytowy.
revision: 6
schema_version: 1
scope: 'MVP eSzkola na rynku polskim: konta opiekunów, profile dzieci, zgody, konfigurowalne
  programy edukacyjne publikowane przez nauczycieli, katalog, grupy, zapisy, zamówienia,
  płatności, harmonogramy, zewnętrzne lekcje online, materiały, obecności, zadania,
  trening, oceny, bezpłatne poprawki, raporty, konsultacje, administracja treścią,
  e-mail i audyt. Przedmiot, grupa docelowa, struktura, liczba i długość zajęć, limity
  grupy, ocenianie, progresja i okres dostępu do materiałów należą do programu. Przykład
  matematyczny nie jest globalną regułą. Sprzedaż MVP odbywa się w PLN; inne waluty,
  własne wideokonferencje, AI tutor, marketplace, aplikacje natywne, otwarty czat
  społecznościowy, premium, B2B, kupony, SMS i zaawansowana analityka pozostają poza
  zakresem. Aktualna bezpośrednia decyzja właściciela rozstrzyga Q-016. BA nie projektuje
  architektury, technologii, modeli danych, API ani zadań implementacyjnych.'
section_notes:
  Architecture_impact: Nie zmieniono architektury, Accepted ADR, SR ani kodu. Po aprobacie
    dokładnej BA downstream impact review obejmuje uprawnienia wyjątków, ocenianie
    i ukończenie, handel w PLN, zmiany warunków, komunikację, KPI i zakres dostępności.
    Zachowano SR-01–SR-15 i dotychczasowe linki; BA nie projektuje ich realizacji.
    Nie uruchomiono SA ani dalszego etapu.
  Changed: 'Analiza wpływu na przekazaną BA revision 5: zaktualizowano SRC-PLAN i
    dodano pusty rejestr SRC-DECISIONS. Uwzględniono bezpośrednie rozstrzygnięcie
    Q-016 w aktorach, BR-001, BR-005, BR-009, BR-010, BR-016, BR-018, BR-020, BR-024,
    BR-026, regułach i ograniczeniach. Rozwiązano wyłącznie otwarte Q-016; wcześniejsze
    rozwiązania i ich rzeczywiste dowody pozostają bez zmian. Usunięto nieaktualne
    odwołania do otwartego Q-016 z modyfikowanych wpisów. Zachowano stabilne ID i
    pozostałe wymagania. Nie zapisano plików; rewizję i aprobatę obsługuje kontroler.'
  Not_verified: 'Nie uruchomiono factory, walidatora patcha, testów architektury ani
    aplikacji. Nie odzyskiwano historycznych źródeł i nie weryfikowano ich bajtów;
    stare dowody pozostawiono jako rzeczywisty zapis bazy bez tworzenia nowych historycznych
    digestów. Tożsamość bazy i bieżące digests oparto na kontekście kontrolera; nie
    porównano lokalnych bajtów artefaktu z baseline_identity. Szczegóły prawne, podatkowe,
    retencji, SLA i ekonomicznej oceny pozostają otwarte. Nie dostarczono exact-content
    approval: approved_ba_evidence jest null. Semantyka i źródła wymagają przeglądu
    właściciela.'
  Verification: Wykonano git status --short oraz odczyt workflow.md, kontraktu, roli
    BA, incremental-analysis.md i docs/business/README.md. Git pokazał zastane zmiany
    oraz ostrzeżenia o niedozwolonym cache xcrun; zmian nie modyfikowano. Analizowano
    kompletną bazę i changed_sources dostarczone przez kontroler, bez odczytu historii.
    Ręcznie sprawdzono zakres §§1–13 decyzji Q-016, zachowanie ID, kompletność zmienionych
    BR, niepuste kryteria, odniesienia i zachowanie rozwiązań. Q-016 jest jedynym
    otwartym blockerem w bazie i ma aktualny bezpośredni dowód rozwiązania. Pozostałe
    pytania pozostają otwarte z uzasadnieniem NON_BLOCKER. Automatycznej walidacji
    patcha nie wykonano.
  handoff_gate: 'Status proponowany READY_FOR_REVIEW po rozwiązaniu Q-016. Brak otwartych
    BLOCKER; Q-007, Q-008, Q-009, Q-010 i Q-012 pozostają OPEN NON_BLOCKER z zachowanymi
    bramkami produkcji, sprzedaży, usługi lub ekonomicznej oceny pilota. Wcześniejsze
    rozwiązania i dowody zachowano. Bramka SA: FAIL, ponieważ nie ma jawnej aprobaty
    dokładnej wynikowej rewizji przez Michała Wanielistę ani zewnętrznego dowodu jej
    digestu. Decyzja Q-016 nie jest aprobatą BA. Zakończono wyłącznie etap BA.'
  source_coverage: 'Aktualna decyzja Q-016 §§1–13 pokrywa wszystkie rozstrzygnięte
    luki: uprawnienia, PLN i ceny, kontynuację, ukończenie, frekwencję, satysfakcję,
    dostępność, zmiany po zakupie, niesamodzielność, powiadomienia, oświadczenie opiekuna
    i wymagania nauczyciela. Rejestr decisions jest pusty. AGENTS i szablon mają digests
    zgodne z bazą; nie nadano przykładom znaczenia globalnych reguł. Bieżący tekst
    planu nie zawiera sekcji Potwierdzenie wcześniejszych decyzji biznesowych — Q-015,
    cytowanej w bazie. Zachowane odpowiedzi i ich dowody odnoszą się do wcześniejszej
    treści; nie przedstawia się tych lokalizacji jako istniejących w nowym planie.
    Pozostałe niezmienione odwołania do tej sekcji należy czytać z zachowanym dowodem
    odpowiednich pytań. Usunięcie sekcji poddano przeglądowi wpływu: nie jest automatycznym
    odwołaniem wcześniejszych reguł. W zakresie Q-016 obowiązuje nowa decyzja, a sprzeczne
    lub niewymienione historyczne szczegóły nie tworzą dodatkowych wymagań ani blockerów.'
