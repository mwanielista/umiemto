open_questions:
- id: SA-Q-001
  question: >-
    Jak dziecko loguje się i odzyskuje dostęp, kto dodaje i odbiera relacje kolejnych
    opiekunów, jak sprawdza się ich uprawnienie, jak działa spór lub utrata dostępu
    oraz jaka jest pełna macierz uprawnień metodyka, obsługi i administracji?
    Jakie operacje wymagają MFA i jak odzyskuje je użytkownik uprzywilejowany?
    BLOCKER dla finalnego zakresu tożsamości i bezpieczeństwa: samo istnienie
    wielu opiekunów nie określa uprawnionych przejść relacji ani dostępu dziecka.
    To doprecyzowanie BA Q-017 i BR-014, nie ponowne otwarcie historycznego Q-016.
  severity: BLOCKER
  owner: Michał Wanielista
  affected_refs: [FR-001, FR-014, NFR-001, UC-001, DATA-001]
  status: OPEN
  resolution: null
- id: SA-Q-002
  question: >-
    Jaki jest aktualny skutek wpłaty po wygaśnięciu rezerwacji lub utracie miejsca?
    Jak ustala się wycenę niezrealizowanej części usługi i kto kwalifikuje zmianę
    jako istotne pogorszenie? BLOCKER dla finalizacji stanów uczestnictwa
    i rozliczeń: nie można samodzielnie wybierać automatycznego zapisu, przeniesienia,
    zwrotu albo proporcji zwrotu. Reguła pełnego zwrotu przed rozpoczęciem oraz
    zwrotu niezrealizowanej części pozostaje przyjęta; pytanie dotyczy jej operacjonalizacji.
  severity: BLOCKER
  owner: Michał Wanielista
  affected_refs: [FR-004, FR-018, UC-003, UC-006, DATA-003]
  status: OPEN
  resolution: null
- id: SA-Q-003
  question: >-
    Czy opiekun może inicjować wątek w imieniu uczestnika i jak współdzieli limit,
    jaki kalendarz wyznacza dwa dni robocze oraz jak określa się aktywność programu
    i zamknięcie konsultacji? NON_BLOCKER dla opisu wymaganych funkcji: zatwierdzone
    jeden wątek tygodniowo, Europe/Warsaw, brak przenoszenia i bezpłatne odpowiedzi
    są wystarczające do wyznaczenia zakresu. Odpowiedź jest wymagana przed
    finalizacją obliczania terminu i dodatkowych przejść; nie przyjęto dawnego 48 h.
  severity: NON_BLOCKER
  owner: Michał Wanielista
  affected_refs: [FR-013, UC-007, DATA-006]
  status: OPEN
  resolution: null
- id: SA-Q-004
  question: >-
    Jak definiuje się aktywną rodzinę i równoczesne zajęcia, profil obciążenia,
    dopuszczalne błędy i czasy odpowiedzi? Jak wyznacza się głównego opiekuna,
    deduplikuje kwalifikującego klienta przy kilku dzieciach i określa granice
    daty zakupu w oknie 60 dni? NON_BLOCKER dla analizy zakresu: cele skali i KPI
    oraz ich podstawowe liczniki i mianowniki są zatwierdzone. Te szczegóły muszą
    zostać rozstrzygnięte przed finalnymi testami obciążenia i raportem pilota;
    nie ustanawia się domyślnego latency ani historycznych jednostek z BA revision 5.
  severity: NON_BLOCKER
  owner: Michał Wanielista
  affected_refs: [FR-024, NFR-005, UC-008, DATA-007]
  status: OPEN
  resolution: null
- id: SA-Q-005
  question: >-
    Jakie granice incydentu, częściowej niedostępności, rozdzielczość obserwacji
    i dowody pomiaru obowiązują dla 99,5 procent? Co rozpoczyna i kończy RTO,
    jaki punkt odniesienia określa RPO i jaki zakres danych ma test odtworzenia?
    NON_BLOCKER dla identyfikacji jakości: liczby i zakres funkcji są zatwierdzone,
    a §19 deleguje metodę dalszej analizie. Odpowiedź wymagana przed zatwierdzeniem
    planu pomiaru i dowodzeniem spełnienia celów; SA nie wybiera infrastruktury.
  severity: NON_BLOCKER
  owner: Michał Wanielista
  affected_refs: [NFR-003, NFR-004, NFR-008, ERR-009]
  status: OPEN
  resolution: null
- id: SA-Q-006
  question: >-
    Jakie finalne zgody, oświadczenia, podstawy i retencja danych, prawa osób,
    umowy z procesorami, VAT, dokumenty sprzedaży, reklamacje, procedury ręcznej
    oceny, przygotowania nauczyciela i incydentów zostaną zatwierdzone?
    NON_BLOCKER dla SA zgodnie z BA Q-007–Q-010 i planem §21: brakujące treści
    i procedury są jawnie odroczone do właściwych bramek produkcyjnych.
    Brak dodatkowego SLA oceny nie upoważnia do przyjęcia czasu z przykładu.
  severity: NON_BLOCKER
  owner: Michał Wanielista
  affected_refs: [FR-001, FR-010, FR-018, FR-019, FR-020, FR-021, NFR-008]
  status: OPEN
  resolution: null
- id: SA-Q-007
  question: >-
    Jakie limity i formaty plików, kryteria walidacji, zasady ponowień integracji,
    retencja diagnostyki oraz warunki alertowania są potrzebne dla MVP?
    NON_BLOCKER dla wyznaczenia wymaganych kontroli: walidacja, ochrona i obsługa
    niepowodzeń są określone bez wyboru dostawcy. Konkretne wartości wymagają
    decyzji przed finalizacją odpowiednich kontraktów i testów; nie tworzy się
    arbitralnych rozmiarów plików, odstępów ani liczby prób.
  severity: NON_BLOCKER
  owner: Michał Wanielista
  affected_refs: [FR-007, FR-016, NFR-007, NFR-008, INT-003, INT-004]
  status: OPEN
  resolution: null
- id: SA-Q-008
  question: >-
    Jakie budżet, marża i kryteria ekonomicznej oceny pilota mają obowiązywać?
    NON_BLOCKER dla SA zgodnie z BA Q-012: ekonomika pozostaje walidacją pilota,
    nie brakującą globalną regułą platformy. Nie ustanawia się celu marży ani
    nowych funkcji księgowych wyłącznie dla wypełnienia pokrycia BR-024.
  severity: NON_BLOCKER
  owner: Michał Wanielista
  affected_refs: [FR-024]
  status: OPEN
  resolution: null
section_notes:
  assumptions: Nie zastosowano niepotwierdzonych założeń zamiast decyzji; niewiadome są pytaniami.
  Changed: >-
    Pierwsza propozycja eszkola-system-analysis revision 1; poprzedniego pliku
    nie było. Zdefiniowano 24 FR, 9 NFR oraz wszystkie wymagane sekcje wspierające
    i pokrycie BR-001–BR-026. Uwzględniono aktualny kanoniczny plan 2.0:
    konfigurowalne ukończenie bez obowiązkowego egzaminu, wszystkie bezpłatne próby,
    prowadzącego nauczyciela bez wymogu autorstwa, rezerwację maksymalnie 24 h,
    proporcjonalny albo pełny zwrot, ważoną frekwencję i aktualne KPI.
    Nie przyjęto wycofanych historycznych szczegółów. Status BLOCKED wynika
    z SA-Q-001 i SA-Q-002, nie z braku aprobaty BA ani starego Q-016.
    Rezerwacja kontrolera dotyczy wyłącznie wskazanego output; brak zmian w repozytorium.
  Verification: >-
    Odczytano Git status, branch feature/create-ba-bs, worktree list, AGENTS,
    workflow, kontrakt i rolę SA, BA, aktualny plan, szablon i baseline.
    Obejrzano diff i stat zmienionego biznesplanu; pełny diff był zbyt długi
    do prezentacji, dlatego analizę oparto na aktualnych źródłach i zatwierdzonej BA.
    shasum potwierdził dokładne SHA-256 BA i trzech źródeł z kontekstu kontrolera.
    Zewnętrzny rekord aprobaty odczytano i porównano z dostarczonym dowodem,
    embedded approval oraz artifact_id, path, revision i digest BA.
    Powtórny odczyt digestów konsumowanych wejść nie wykazał zmian; output pozostał ABSENT.
    Ręcznie sprawdzono pola kontraktu, unikalność ID, niepuste kryteria FR/NFR,
    istniejące BR, source_refs, supporting requirement_refs, actor_refs,
    affected_refs oraz zgodność pokrycia i statusu z pytaniami.
    Jest to przegląd ręczny, nie wykonanie walidatora BA/SA ani dowód poprawności
    analizy. Git zwracał wyniki mimo odmowy utworzenia cache xcrun.
    Próba odczytu digestów przez heredoc została odrzucona przez sandbox;
    użyto shasum bez zapisu. Zachowano zastane dirty changes innych autorów.
  br_coverage: >-
    Wszystkie 26 BR mają niepuste powiązania, ale pokrycie nie jest aprobatą
    ani dowodem domknięcia każdego szczegółu. BR-001 i BR-014 pozostają częściowo
    zależne od SA-Q-001; BR-004 i BR-018 od SA-Q-002. BR-020 zawiera także
    obowiązki organizacyjne, których system jedynie odnotowuje spełnienie.
    Ekonomika BR-024 jest walidacją właściciela, bez wymyślania automatyzacji
    finansowej. BR-025 i BR-026 są pokryte NFR, nie sztucznymi funkcjami.
    Brak niepokrytych BR; ograniczenia i otwarte szczegóły są jawnie wskazane.
  Architecture_impact: >-
    Wymagania mają znaczenie dla tożsamości i zasobowego dostępu, konfiguracji
    edukacji, wersji i historii ocen, handlu, limitów konsultacji, plików,
    integracji, audytu, KPI i odtworzenia. Nie zmieniono architektury ani ADR.
    Baseline SR-03–SR-05 i dokumenty o dawnych regułach wymagają późniejszego
    przeglądu wpływu; ich ID i linki pozostają zachowane. Dependent architectural
    work jest zatrzymane do rozwiązania BLOCKER i aprobaty dokładnej SA.
    Nie uruchomiono Architect, Planner, reviewer ani innego etapu.
  Not_verified: >-
    Nie wykonano automatycznego parsowania końcowej propozycji ani walidacji BA/SA;
    nie uruchomiono factory ani architecture validator. Walidacja architektury
    nie dowodzi poprawności analizy. Nie przeprowadzono testów aplikacji,
    obciążenia, bezpieczeństwa, dostępności, odtworzenia, WCAG, przeglądu prawnego
    lub podatkowego ani pomiaru KPI. Nie wykonano pełnego audytu Accepted ADR
    ani migracji SR. Nie zweryfikowano niewidocznych sesji i nie ustanowiono
    rezerwacji upstream poza przekazanym kontekstem. Kontroler musi ponownie
    sprawdzić wejścia i ABSENT output bezpośrednio przed własnym zapisem;
    ta propozycja nie zmienia ani nie zwalnia rezerwacji. Nie udzielono aprobaty SA.
  handoff_gate: >-
    BA input gate PASS: APPROVED revision 6, zgodny dokładny digest i zewnętrzny
    dowód Michała Wanielisty, brak otwartych BA BLOCKER. SA status BLOCKED,
    approval null. OPEN BLOCKER: SA-Q-001, SA-Q-002. OPEN NON_BLOCKER:
    SA-Q-003–SA-Q-008, każde z uzasadnieniem, właścicielem i affected_refs.
    Architect handoff FAIL: wymagane rzeczywiste odpowiedzi z dowodami,
    przegląd uzupełnionej SA oraz zewnętrzna aprobata dokładnej rewizji.
    Nie zatwierdzono własnego artefaktu i zakończono wyłącznie etap SA.
