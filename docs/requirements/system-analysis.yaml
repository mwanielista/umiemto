functional_requirements:
- id: FR-001
  description: System obsługuje konta opiekunów, profile dzieci, zgody i odrębny dostęp
    edukacyjny dziecka.
  rationale: Odpowiedzialność dorosłego jest odrębna od korzystania z edukacji.
  priority: MUST
  br_refs:
  - BR-001
  - BR-019
  acceptance_criteria:
  - Opiekun rejestruje konto i składa wymagane oświadczenia pełnoletności, uprawnienia
    oraz prawdziwości danych; akceptacja zachowuje osobę, wersję i czas.
  - Pierwszy poprawnie zweryfikowany opiekun zostaje głównym; tworzy dostęp dziecka
    i otrzymuje jego login bez wymogu e-mail lub telefonu dziecka.
  - Uprawniony opiekun ustawia lub resetuje hasło dziecka; administrator odzyskuje
    dostęp wyłącznie po weryfikacji uprawnienia i z audytem.
  - Zaproszenie dodatkowego opiekuna wskazuje dziecko i konkretną osobę, wymaga jej
    własnego konta oraz przyjęcia i pozostawia historię; dodatkowy opiekun nie zaprasza
    kolejnych.
  - Główny opiekun może odebrać dodatkowy dostęp bez usuwania historii; zmiana głównego
    wymaga jego zgody albo zweryfikowanej, audytowanej decyzji administratora.
  - Spór może blokować zmiany relacji do ręcznego rozstrzygnięcia; utrata dostępu
    wszystkich opiekunów wymaga ręcznej weryfikacji administratora.
  - Dziecko nie zarządza opiekunami, zgodami dorosłych, zakupami ani rozliczeniami
    i nie odzyskuje dostępu niezależnym kanałem wymagającym pełnoletności.
  source_refs:
  - source_id: SRC-BA
    locator: BR-001; BR-019; Q-017
  - source_id: SRC-SYSTEM
    locator: SA-Q-001 / Dostęp dziecka; Relacje opiekunów
  - source_id: SRC-SYSTEM
    locator: SA-Q-006
- id: FR-002
  description: Katalog przedstawia ofertę i istotne warunki wersji programu przed
    zakupem.
  rationale: Kupujący musi znać zakres zobowiązania edukacyjnego i handlowego.
  priority: MUST
  br_refs:
  - BR-002
  - BR-018
  acceptance_criteria:
  - Oferta podaje przedmiot, grupę docelową, wymagania wejściowe, cele, strukturę,
    liczbę i długość zajęć, limity grupy oraz okres dostępu do materiałów.
  - Pełna cena brutto w PLN i istotne warunki realizacji są widoczne przed zakupem.
  - Oferta identyfikuje opublikowaną wersję, grupę i harmonogram.
  source_refs:
  - source_id: SRC-BA
    locator: BR-002; BR-018
- id: FR-003
  description: Kwalifikacja i diagnoza stosują wymagania wejściowe właściwej wersji
    programu.
  rationale: Programy mają różne kryteria uczestnictwa.
  priority: MUST
  br_refs:
  - BR-003
  acceptance_criteria:
  - Przewidziana diagnoza zachowuje wynik i rekomendację według kryteriów wersji.
  - Ocena wymagań wejściowych wskazuje wymagania i wersję.
  - Program bez diagnozy nie wymaga globalnego testu ani progów przykładu matematycznego.
  source_refs:
  - source_id: SRC-BA
    locator: BR-003
- id: FR-004
  description: System wiąże zamówienie, zweryfikowaną płatność i uczestnictwo dziecka
    w grupie.
  rationale: Ograniczenia miejsc i skutki wpłat muszą być jednoznaczne.
  priority: MUST
  br_refs:
  - BR-004
  - BR-018
  acceptance_criteria:
  - Zamówienie wskazuje opiekuna, dziecko, ofertę, wersję, grupę, zakupione warunki,
    kwotę i PLN; nieopłacona rezerwacja trwa najwyżej 24 godziny.
  - Płatność jest weryfikowana po stronie systemu; sam powrót przeglądarki nie potwierdza
    zapłaty.
  - Zweryfikowana płatność tworzy najwyżej jedno uczestnictwo; równoczesne zakupy
    nie przekraczają liczebności grupy.
  - Płatność po wygaśnięciu pozostaje związana z pierwotnym zamówieniem; dostępne
    pierwotne miejsce pozwala potwierdzić udział.
  - Przy braku pierwotnego miejsca zamówienie wymaga rozstrzygnięcia; opiekun otrzymuje
    propozycję zaakceptowanej alternatywnej grupy lub edycji albo pełnego zwrotu.
  - Brak decyzji opiekuna nie oznacza zgody na inną grupę; powtórzenie potwierdzenia
    nie powiela uczestnictwa ani skutku finansowego.
  source_refs:
  - source_id: SRC-BA
    locator: BR-004; BR-018; Q-017
  - source_id: SRC-SYSTEM
    locator: SA-Q-002 / Płatność po wygaśnięciu rezerwacji
  - source_id: SRC-AGENTS
    locator: §21 Payments
- id: FR-005
  description: Rozpoczęcie kolejnego etapu stosuje skonfigurowaną progresję niezależnie
    od zakupu.
  rationale: Zakup nie zastępuje warunku edukacyjnego.
  priority: MUST
  br_refs:
  - BR-005
  - BR-011
  acceptance_criteria:
  - Bez skonfigurowanego warunku nie wymaga się zaliczenia poprzednika; zakup następnika
    nie jest globalnie zabroniony.
  - Wynik wstępny lub oczekujący weryfikacji nie spełnia warunku finalnego zaliczenia;
    finalne zaliczenie usuwa właściwą blokadę.
  - Wyjątek może nadać przypisany prowadzący nauczyciel, uprawniony administrator
    lub Business Owner; autorstwo nie jest konieczne, a sama rola metodyka nie wystarcza.
  - Wyjątek zachowuje osobę, uczestnika, program lub etap, czas i uzasadnienie.
  source_refs:
  - source_id: SRC-BA
    locator: BR-005; BR-011; Q-005
- id: FR-006
  description: Harmonogram udostępnia zajęcia, informacje do dołączenia i rejestrację
    obecności.
  rationale: Rodzina i nauczyciel potrzebują jednoznacznych informacji o realizacji.
  priority: MUST
  br_refs:
  - BR-006
  - BR-024
  acceptance_criteria:
  - Uczestnik i opiekun widzą harmonogram własnej grupy oraz informacje do zewnętrznej
    lekcji.
  - Przypisany nauczyciel zapisuje obecność konkretnego uczestnika na konkretnych
    zajęciach.
  - Liczba i długość zajęć odpowiadają programowi; prezentacja stosuje Europe/Warsaw
    i zmianę czasu.
  - Odwołanie, brak realizacji i przełożenie są rozróżniane; przełożenie nie podwaja
    możliwej obecności.
  source_refs:
  - source_id: SRC-BA
    locator: BR-006; BR-024
- id: FR-007
  description: System udostępnia materiały, zadania i odpowiedzi zgodnie z uczestnictwem
    i okresem dostępu.
  rationale: Nauka i jej dowody muszą odpowiadać zakupionej usłudze.
  priority: MUST
  br_refs:
  - BR-007
  acceptance_criteria:
  - Uczestnik odczytuje udostępnione materiały i zadania oraz przesyła odpowiedź do
    właściwego zadania i uczestnictwa.
  - Uprawniony nauczyciel sprawdza odpowiedzi wymagające oceny ręcznej i udziela informacji
    zwrotnej.
  - Okres dostępu pochodzi z oferty lub programu; nie narzuca się 90 dni.
  - Niekompletne lub odrzucone przesłanie nie jest skutecznie oddaną pracą; status
    pliku odróżnia oczekiwanie na kontrolę od dopuszczenia i odrzucenia.
  source_refs:
  - source_id: SRC-BA
    locator: BR-007
  - source_id: SRC-SYSTEM
    locator: SA-Q-007 / Pliki w MVP
- id: FR-008
  description: Trening i próbne sprawdzanie są odrębne od właściwej oceny.
  rationale: Przygotowanie nie zastępuje finalnego zaliczenia ani nie ujawnia egzaminu.
  priority: MUST
  br_refs:
  - BR-008
  - BR-023
  acceptance_criteria:
  - Uczestnik wykonuje przewidziany trening i otrzymuje przewidziane wskazówki lub
    wyjaśnienia.
  - Wynik treningowy lub próbny jest oznaczony odrębnie od finalnego egzaminu.
  - Trening nie ujawnia klucza właściwego egzaminu przed zakończeniem oceny i uprawnionym
    przeglądem.
  source_refs:
  - source_id: SRC-BA
    locator: BR-008; BR-023
- id: FR-009
  description: Ocena i ukończenie stosują jawne kryteria wersji programu lub etapu.
  rationale: Ukończenie i opanowanie efektów nie są zawsze tożsame.
  priority: MUST
  br_refs:
  - BR-009
  acceptance_criteria:
  - Program może kończyć się z egzaminem albo bez niego.
  - Progi, czas, kryteria odpowiedzi i efektów pochodzą z wersji; nie stosuje się
    globalnych 75 procent.
  - Bez egzaminu i dodatkowych kryteriów ukończenie wymaga wszystkich elementów oznaczonych
    jako wymagane.
  - Ukończenie nie oznacza automatycznie opanowania wszystkich efektów, jeśli program
    tego nie wymaga.
  source_refs:
  - source_id: SRC-BA
    locator: BR-009
- id: FR-010
  description: Próba zachowuje historyczną podstawę i rozróżnia wynik wstępny, weryfikowany
    i finalny.
  rationale: Ocena musi być odtwarzalna i odporna na retroaktywne edycje.
  priority: MUST
  br_refs:
  - BR-010
  - BR-015
  acceptance_criteria:
  - Próba zachowuje dokładne wersje programu, pytań, kryteriów odpowiedzi i zasad
    oceniania; edycje nie zmieniają historycznej podstawy ani wyników.
  - Wymagana ocena ręczna pozostawia wynik wstępny do uprawnionego zatwierdzenia.
  - Podejrzenie niesamodzielności pozostawia wynik niefinalny do weryfikacji przez
    uprawnionego nauczyciela lub administratora.
  - Weryfikacja, zatwierdzenie i korekta zachowują wykonawcę, czas, decyzję, wymagane
    uzasadnienie i poprzednią ocenę.
  - Ręczna ocena i obsługa incydentu mogą być śledzone jako kontrolowany proces z
    audytem bez narzucenia globalnego SLA.
  source_refs:
  - source_id: SRC-BA
    locator: BR-010; BR-015; Q-009
  - source_id: SRC-SYSTEM
    locator: SA-Q-006
- id: FR-011
  description: Wszystkie poprawki i kolejne próby zaliczenia są bezpłatne.
  rationale: Niezaliczenie nie może generować przychodu z kolejnych prób.
  priority: MUST
  br_refs:
  - BR-011
  acceptance_criteria:
  - Kolejna próba nie tworzy należności ani wymogu zakupu poprawki.
  - Dostępność próby stosuje zasady wersji programu; bezpłatność nie oznacza nieograniczonej
    liczby prób.
  - Finalne zaliczenie aktualizuje wynik i właściwą skonfigurowaną progresję.
  source_refs:
  - source_id: SRC-BA
    locator: BR-011
- id: FR-012
  description: Opiekun otrzymuje postęp dziecka, a uczestnik zrozumiały następny krok.
  rationale: Dane edukacyjne mają wspierać dalsze działanie rodziny.
  priority: MUST
  br_refs:
  - BR-012
  - BR-022
  acceptance_criteria:
  - Raport przedstawia frekwencję, realizację wymaganych elementów, zastosowane wyniki
    i postęp według wersji programu.
  - Jeśli przewidziano, raport obejmuje efekty, mocne strony, obszary pracy i rekomendację.
  - Opiekun widzi wyłącznie uprawnione dzieci; wyniki wstępne są odróżnione od finalnych.
  - Panel uczestnika wyjaśnia oczekiwane działanie i przyczynę blokady.
  source_refs:
  - source_id: SRC-BA
    locator: BR-012; BR-022
- id: FR-013
  description: Konsultacje odbywają się w kontrolowanych, archiwizowanych wątkach
    ze wspólnym limitem.
  rationale: Pomoc wymaga granic i widoczności dla rodziny.
  priority: MUST
  br_refs:
  - BR-013
  - BR-020
  acceptance_criteria:
  - Dziecko lub uprawniony opiekun w jego imieniu otwiera najwyżej jeden nowy wątek
    na aktywne uczestnictwo/program w tygodniu poniedziałek 00:00–niedziela 23:59
    Europe/Warsaw.
  - Limit jest wspólny dla dziecka i wszystkich opiekunów, nie przechodzi dalej; odpowiedzi
    go nie zużywają, a równoczesne próby nie pozwalają go obejść.
  - Konsultacje wymagają aktywnego uczestnictwa, rozpoczętego okresu dostępu i niezakończonego
    okresu konsultacji z oferty/programu.
  - Cel odpowiedzi do dwóch dni roboczych jest liczony od utworzenia wątku według
    poniedziałku–piątku z wyłączeniem polskich dni ustawowo wolnych; historia zachowuje
    czas otwarcia i odpowiedzi.
  - Nauczyciel lub uprawniony administrator zamyka wątek po rozwiązaniu sprawy albo
    zakończeniu uprawnionego okresu; historia pozostaje i zwykły użytkownik jej nie
    usuwa.
  - Komunikacja jest kontrolowana, moderowana przez uprawnionych i widoczna aktywnie
    uprawnionemu opiekunowi; system nie kieruje dzieci do prywatnych kont nauczyciela.
  source_refs:
  - source_id: SRC-BA
    locator: BR-013; BR-020; Q-017
  - source_id: SRC-SYSTEM
    locator: SA-Q-003
- id: FR-014
  description: Operacje sprawdzają rolę i aktywne uprawnienie do konkretnego zasobu.
  rationale: Sama rola nie dowodzi prawa do dziecka lub grupy.
  priority: MUST
  br_refs:
  - BR-014
  - BR-001
  - BR-019
  acceptance_criteria:
  - Opiekun ma dostęp tylko przez aktywną relację, dziecko tylko do własnych zasobów
    edukacyjnych; odebranie relacji blokuje dalsze operacje na danych dziecka.
  - Nauczyciel ma dostęp do przypisanych albo jawnie udostępnionych programów, grup
    i uczestników; dane rozliczeniowe nie są dostępne bez potrzeby wynikającej z obowiązków.
  - Metodyk korzysta z treści, kryteriów i danych niezbędnych do jakości; sama rola
    nie daje zakupów, zwrotów, zarządzania opiekunami, wyjątku progresji ani nieograniczonego
    dostępu do dziecka.
  - Obsługa odczytuje dane potrzebne do sprawy i przygotowuje operacje; bez odrębnego
    uprawnienia nie nadaje dostępu po sporze, nie zmienia finalnej oceny i nie przyznaje
    wyjątku progresji.
  - Administrator wykonuje wyłącznie uprawnione operacje uczestnictwa, rozliczeń,
    relacji, incydentów i moderacji z audytem; Business Owner wykonuje uprawnienia
    z BA.
  - Bezpośrednie żądanie zasobu podlega takiej samej kontroli jak interfejs; aprobata
    BA/SA nie jest funkcją produktu.
  source_refs:
  - source_id: SRC-BA
    locator: BR-014; BR-001; BR-019
  - source_id: SRC-SYSTEM
    locator: SA-Q-001 / Macierz uprawnień
  - source_id: SRC-AGENTS
    locator: §14; §22
- id: FR-015
  description: Istotne i uprzywilejowane działania pozostawiają kontrolowaną historię
    audytu.
  rationale: Decyzje muszą być rozliczalne.
  priority: MUST
  br_refs:
  - BR-015
  acceptance_criteria:
  - Audyt obejmuje zmiany ocen i uprawnień, wyjątki progresji, weryfikację niesamodzielności,
    istotną administrację, moderację, recovery i ręczne decyzje zwrotowe.
  - Wpis wskazuje wykonawcę, działanie, zasób, czas i wymagane uzasadnienie.
  - Uprawniona osoba może prześledzić zmianę; nieuprawniony użytkownik nie odczytuje
    ani nie modyfikuje audytu.
  - Odebranie relacji nie usuwa historycznych zdarzeń i zgód; retencja audytu jest
    odrębna od diagnostyki.
  source_refs:
  - source_id: SRC-BA
    locator: BR-015
  - source_id: SRC-SYSTEM
    locator: SA-Q-001; SA-Q-002; SA-Q-007 / Diagnostyka
- id: FR-016
  description: System informuje rodzinę o zakupie i ważnych zdarzeniach realizacji.
  rationale: Rodzina potrzebuje informacji umożliwiających udział i rozliczenie.
  priority: MUST
  br_refs:
  - BR-016
  - BR-021
  acceptance_criteria:
  - Powiadomienia obejmują zakup lub płatność, zapis i ważne zdarzenia programu.
  - Zmiany terminu, odwołania i istotne zmiany organizacyjne są komunikowane uczestnikowi
    i opiekunowi przez platformę bez zbędnej zwłoki; nie narzuca się globalnego liczbowego
    SLA zmian zajęć.
  - E-mail rozróżnia przygotowanie, przekazanie do wysyłki i błąd; nie zakłada przeczytania
    wiadomości.
  - Błąd e-mail nie cofa płatności, zapisu ani harmonogramu; platforma pokazuje aktualny
    stan.
  - Bezpieczne ponowienia stosują reguły NFR-010 i pozostawiają status do ręcznej
    obsługi po wyczerpaniu prób.
  source_refs:
  - source_id: SRC-BA
    locator: BR-016; BR-021
  - source_id: SRC-SYSTEM
    locator: SA-Q-007 / Retry integracji
- id: FR-017
  description: Nauczyciel tworzy, wersjonuje i publikuje konfigurowalny program z
    kontrolą jakości treści.
  rationale: Różne przedmioty wymagają konfiguracji i ochrony zakupionych warunków.
  priority: MUST
  br_refs:
  - BR-017
  - BR-002
  - BR-009
  acceptance_criteria:
  - Program określa przedmiot, grupę docelową, wymagania wejściowe, strukturę, cele,
    mierzalne efekty, ocenianie, ukończenie i progresję.
  - Liczba i długość zajęć, liczebność grupy i okres materiałów są konfigurowalne;
    cztery lekcje ani klasa przykładu nie są globalną regułą.
  - Wersja robocza jest odrębna od opublikowanej; uczestnictwo identyfikuje realizowaną
    wersję.
  - Kontrola treści obejmuje kryteria efektów, dostosowania i prawa użycia materiałów.
  - Edycja nie nadpisuje niejawnie zakupionych istotnych warunków ani historycznej
    podstawy ocen.
  source_refs:
  - source_id: SRC-BA
    locator: BR-017; BR-002; BR-009
- id: FR-018
  description: System obsługuje akceptację pogorszenia zakupionych warunków i kontrolowane
    rozliczenie zwrotu.
  rationale: Zmiana usługi nie może pomijać zobowiązań wobec opiekuna.
  priority: MUST
  br_refs:
  - BR-018
  - BR-021
  acceptance_criteria:
  - Istotne pogorszenie oznacza uprawniony administrator realizacji lub Business Owner;
    system nie podejmuje automatycznej decyzji prawnej, a spór rozstrzyga Business
    Owner lub formalnie uprawniona osoba zgodnie z procedurą.
  - Kandydaci do kwalifikacji obejmują zmniejszenie zajęć lub materiałów, skrócenie
    dostępu, istotną zmianę efektów, pogorszenie kryteriów, istotną zmianę harmonogramu
    lub formy; lista nie zastępuje decyzji.
  - Pogorszenie wymaga zarejestrowanej akceptacji opiekuna konkretnej zmiany; jej
    brak i niemożność pierwotnej realizacji prowadzą do zaakceptowanej alternatywy
    albo zwrotu niezrealizowanej części.
  - Opcjonalny plan rozliczeniowy oferty przypisuje wartości elementom, których suma
    równa się cenie brutto; zwrot niezrealizowanej części sumuje niezrealizowane elementy
    zakupionej wersji planu.
  - Bez jednoznacznego planu administrator wprowadza kwotę zgodnie z zatwierdzoną
    polityką; system zachowuje kwotę, walutę, podstawę, osobę, czas i uzasadnienie
    bez wymyślania proporcji.
  - Zwrot nie przekracza zapłaconej kwoty pomniejszonej o wcześniejsze skuteczne zwroty,
    również przy równoczesnych operacjach; samo zlecenie nie oznacza skutecznego zwrotu.
  - Przed rozpoczęciem usługi niemożliwej na zakupionych warunkach zwrot jest pełny;
    nieobecność na prawidłowo zrealizowanych zajęciach nie daje automatycznego zwrotu.
  source_refs:
  - source_id: SRC-BA
    locator: BR-018; BR-021
  - source_id: SRC-SYSTEM
    locator: SA-Q-002 / Wycena niezrealizowanej części; Istotne pogorszenie
- id: FR-019
  description: Dane dzieci mają celowy, kontrolowany cykl bez publicznych profili
    i domyślnego nagrywania.
  rationale: Minimalizacja ogranicza ryzyko dla uczestnika.
  priority: MUST
  br_refs:
  - BR-019
  acceptance_criteria:
  - Gromadzi się dane potrzebne do udokumentowanych celów; nie ma publicznych profili
    i otwartego kontaktu niepowiązanych użytkowników.
  - Nagrywanie nie jest domyślne i wymaga osobno zatwierdzonego celu, podstawy, informacji,
    dostępu i retencji.
  - Zgody i oświadczenia są wersjonowane; akceptacja wskazuje osobę, wersję i czas.
  - Konfigurowalne polityki retencji i kontrolowane procesy praw osób umożliwiają
    wykonanie zatwierdzonych decyzji bez wymyślania okresów lub podstaw prawnych.
  - Odpowiednia produkcja wymaga zatwierdzonych polityk, tekstów i umów z procesorami;
    wsad systemowy nie zatwierdza tych dokumentów.
  source_refs:
  - source_id: SRC-BA
    locator: BR-019; Q-007
  - source_id: SRC-SYSTEM
    locator: SA-Q-006
- id: FR-020
  description: Administracja odnotowuje przygotowanie nauczyciela do pracy z dziećmi.
  rationale: Organizator potrzebuje informacji o spełnieniu warunków organizacyjnych.
  priority: MUST
  br_refs:
  - BR-020
  acceptance_criteria:
  - Uprawniona administracja odnotowuje wykonanie zatwierdzonych weryfikacji, dokumentów
    lub oświadczeń i szkoleń.
  - Potwierdzenia obejmują ochronę małoletnich, kontrolowaną komunikację oraz szkolenia
    bezpieczeństwa i platformy.
  - Dane weryfikacyjne mają ograniczony dostęp i minimalny zakres.
  - Dokumenty i procedury są zatwierdzane przed odpowiednią produkcją; system nie
    zastępuje organizacyjnej ani prawnej weryfikacji.
  source_refs:
  - source_id: SRC-BA
    locator: BR-020; Q-010
  - source_id: SRC-SYSTEM
    locator: SA-Q-006
- id: FR-021
  description: Uprawniona administracja obsługuje zakłócenia zajęć i sprawy organizacyjne.
  rationale: Usługa wymaga dalszej realizacji albo rozliczenia.
  priority: MUST
  br_refs:
  - BR-021
  acceptance_criteria:
  - Nieobecność prowadzącego pozwala ustalić zastępstwo albo nowy termin powiązany
    z pierwotnymi zajęciami; awaria uniemożliwiająca lekcję prowadzi do nowego terminu
    i informacji rodzinie.
  - Administracja obsługuje grupy, reklamacje, zwroty, incydenty i moderację zgodnie
    z uprawnieniami i audytem.
  - Sprawa ma śledzony status; kontrolowany proces zachowuje decyzje i wykonawców.
  - Odwołanie lub przełożenie nie powoduje niejawnej utraty usługi ani podwójnej frekwencji;
    finalne procedury są bramką produkcyjną.
  source_refs:
  - source_id: SRC-BA
    locator: BR-021
  - source_id: SRC-SYSTEM
    locator: SA-Q-006
- id: FR-022
  description: Podstawowe procesy mają polski, responsywny i zrozumiały interfejs.
  rationale: Użytkownik musi rozumieć działania i błędy.
  priority: MUST
  br_refs:
  - BR-022
  acceptance_criteria:
  - Procesy opiekuna, uczestnika i nauczyciela mają polskie etykiety i zrozumiałą
    walidację.
  - Podstawowe procesy działają na urządzeniach mobilnych i desktopowych bez utraty
    istotnych informacji.
  - Dostosowania programu zachowują mierzoną umiejętność i nie podpowiadają metody
    rozwiązania.
  source_refs:
  - source_id: SRC-BA
    locator: BR-022
- id: FR-023
  description: Treści i odpowiedzi matematyczne są przedstawiane i oceniane według
    kryteriów zadania.
  rationale: Prezentacja w przeglądarce nie jest autorytatywną oceną.
  priority: MUST
  br_refs:
  - BR-023
  - BR-008
  acceptance_criteria:
  - Wzory stosują LaTeX-compatible notation; uczestnik udziela odpowiedzi przewidzianej
    w zadaniu.
  - System ocenia po swojej stronie według kryteriów; przesłana ocena klienta nie
    jest autorytatywna.
  - Wyrażenia nie wykonują arbitralnego kodu.
  - Klucz egzaminu nie trafia do przeglądarki przed zakończeniem oceny i uprawnionym
    przeglądem.
  - MVP nie wymaga rozpoznawania odręcznych równań.
  source_refs:
  - source_id: SRC-BA
    locator: BR-023; BR-008
  - source_id: SRC-AGENTS
    locator: §24
- id: FR-024
  description: System raportuje KPI pilota i dane ekonomiczne według zatwierdzonych
    definicji.
  rationale: Pilot wymaga porównywalnych wskaźników i danych do oceny poza systemem.
  priority: MUST
  br_refs:
  - BR-024
  acceptance_criteria:
  - Ukończenie jest ilorazem ukończeń według wersji i uczestników rozpoczynających
    mierzony program lub etap; cel wynosi co najmniej 70 procent.
  - Kontynuacja obejmuje kwalifikacje z ukończonym wymaganym etapem, opublikowaną
    płatną logiczną kontynuacją i spełnionymi warunkami wejściowymi; brak oferty wyłącza
    z mianownika.
  - Jednostką kwalifikacji jest opiekun kupujący, dziecko, zakończone uczestnictwo
    i logiczna kontynuacja; ponowne udostępnienie tej samej kontynuacji nie tworzy
    nowej kwalifikacji.
  - Okno 60 dni zaczyna się od późniejszej daty ukończenia lub udostępnienia zakupu;
    liczy się zweryfikowana płatność do końca 60. dnia Europe/Warsaw, a cel wynosi
    co najmniej 60 procent.
  - Frekwencja indywidualna używa obecności i możliwych obecności; agregowana używa
    sum obu wartości. Odwołane niezrealizowane zajęcia są wyłączone, przełożone liczone
    raz; cel agregowany wynosi co najmniej 80 procent.
  - Jedna ankieta w skali 1–5 przypada na zakończone uczestnictwo; adresatem jest
    główny opiekun w chwili zakończenia, a jego zmiana nie tworzy drugiej ankiety.
    Raport pokazuje średnią, wysłane ankiety, odpowiedzi i response rate; cel średniej
    wynosi co najmniej 4,2/5.
  - Raport ujawnia zakres, liczniki i mianowniki; zerowy mianownik oznacza brak podstawy
    wskaźnika.
  - Dostępne są przychód sprzedaży, skuteczne zwroty, płatne uczestnictwa, wykorzystanie
    miejsc i kontynuacje oraz dane do zestawienia kosztów zmiennych poza systemem.
  - KPI są celami pilota, nie gwarancją wyników; MVP nie wymaga pełnego P&L ani automatycznego
    GO/NO-GO, a budżet jest osobną decyzją właściciela.
  source_refs:
  - source_id: SRC-BA
    locator: BR-024; Q-012; Q-017
  - source_id: SRC-SYSTEM
    locator: SA-Q-004 / Główny opiekun dla KPI; Deduplikacja klienta dla kontynuacji
  - source_id: SRC-SYSTEM
    locator: SA-Q-008
non_functional_requirements:
- id: NFR-001
  description: Uwierzytelnienie i kontrola dostępu chronią zasoby i działania uprzywilejowane.
  rationale: Ochrona działa niezależnie od interfejsu.
  priority: MUST
  br_refs:
  - BR-014
  - BR-019
  - BR-015
  acceptance_criteria:
  - Bezpośredni odczyt i zmiana cudzych dzieci, grup, ocen, konsultacji i plików są
    odrzucane.
  - MFA jest obowiązkowe dla nauczycieli, metodyków, obsługi, administratorów i kont
    Business Owner; dla dziecka nie jest obowiązkowe, dla opiekuna jest opcjonalne
    w MVP.
  - Recovery MFA używa wcześniej wygenerowanego kodu albo dodatkowej weryfikacji przez
    uprawnionego administratora; administrator nie zatwierdza własnego recovery.
  - Reset unieważnia poprzednią konfigurację, wymusza ponowną konfigurację i jest
    audytowany; możliwe jest unieważnienie aktywnych sesji.
  - Produkcyjna komunikacja stosuje HTTPS, a sekrety pozostają poza repozytorium.
  source_refs:
  - source_id: SRC-BA
    locator: BR-014; BR-019; BR-015
  - source_id: SRC-SYSTEM
    locator: SA-Q-001 / MFA; Odzyskiwanie MFA
  - source_id: SRC-AGENTS
    locator: §23; §25
- id: NFR-002
  description: Operacje finansowe zachowują poprawność kwot i jednoznaczność skutków.
  rationale: Powtórzenia i reprezentacja kwot nie mogą zmieniać rozliczeń.
  priority: MUST
  br_refs:
  - BR-004
  - BR-018
  acceptance_criteria:
  - Kwoty są decimal-safe i mają walutę; zapis i obliczenia nie używają binary floating-point
    dla pieniędzy.
  - Powtórne i równoczesne potwierdzenia nie powielają płatności, zapisów, zwrotów
    ani operacji biznesowych.
  - Niezweryfikowane lub sprzeczne potwierdzenie nie nadaje opłaconego uczestnictwa
    ani fikcyjnego powodzenia zwrotu.
  - Łączne skuteczne zwroty nie przekraczają rzeczywiście zapłaconej kwoty.
  source_refs:
  - source_id: SRC-BA
    locator: BR-004; BR-018
  - source_id: SRC-AGENTS
    locator: §21 Money; Payments
  - source_id: SRC-SYSTEM
    locator: SA-Q-002
- id: NFR-003
  description: Kontrolowane przez eSzkola funkcje osiągają 99,5 procent miesięcznej
    dostępności.
  rationale: Podstawowe procesy muszą być dostępne rodzinie i nauczycielowi.
  priority: MUST
  br_refs:
  - BR-026
  acceptance_criteria:
  - Zakres obejmuje logowanie, katalog, zakup i zapis, panele rodziny, podstawowe
    funkcje nauczyciela, harmonogram, informacje do zajęć, materiały, oddawanie prac,
    wyniki, raporty, progresję i konsultacje.
  - Pomiar ma rozdzielczość minuty; dana funkcja jest niedostępna przy dwóch kolejnych
    nieudanych kontrolach podstawowego procesu w tej minucie lub jednoznacznie potwierdzonej
    blokującej awarii aplikacji.
  - Częściowa awaria blokująca podstawowy proces liczy się do niedostępności mimo
    odpowiedzi pozostałych funkcji.
  - Wyłączenie serwisu wymaga informacji użytkownikom co najmniej 24 godziny wcześniej;
    raport zachowuje okres, czas objęty pomiarem, wyłączenia, niedostępność, funkcję
    i źródło dowodu.
  - Miesięczny raport umożliwia odtworzenie udziału dostępnego czasu po prawidłowych
    wyłączeniach i weryfikację celu 99,5 procent dla objętych funkcji.
  - Awaria zewnętrznego wideo nie jest automatycznie awarią eSzkola; brak informacji
    do dołączenia po stronie platformy należy do pomiaru.
  source_refs:
  - source_id: SRC-BA
    locator: BR-026
  - source_id: SRC-SYSTEM
    locator: SA-Q-005 / Pomiar dostępności 99,5%
  - source_id: SRC-PLAN
    locator: §19
- id: NFR-004
  description: Odtworzenie spełnia RPO do 24 godzin i RTO do czterech godzin.
  rationale: Utrata danych i przerwa wymagają kontrolowanych granic.
  priority: MUST
  br_refs:
  - BR-026
  - BR-019
  acceptance_criteria:
  - RTO zaczyna się przy wcześniejszym automatycznym wykryciu lub ręcznym potwierdzeniu
    krytycznej awarii i kończy po przywróceniu objętych funkcji oraz co najmniej 15
    kolejnych minutach poprawnych kontroli; cały ten okres nie przekracza czterech
    godzin.
  - RPO porównuje czas ostatnich poprawnie zapisanych danych przed awarią z najnowszym
    stanem odtwarzalnym z backupu względem trwałych zdarzeń biznesowych; różnica nie
    przekracza 24 godzin.
  - Test obejmuje konta, relacje, programy i wersje, oferty, grupy, harmonogram, uczestnictwa,
    zamówienia, płatności, zwroty, zgody, oświadczenia, zadania, odpowiedzi, próby,
    wyniki, konsultacje, pliki i audyt.
  - Test po odtworzeniu sprawdza spójność danych i podstawowe procesy; samo uruchomienie
    aplikacji nie wystarcza.
  - Rutynowe wdrożenie nie usuwa danych użytkowników; persistent volume nie stanowi
    backupu.
  source_refs:
  - source_id: SRC-BA
    locator: BR-026; BR-019; Q-017
  - source_id: SRC-SYSTEM
    locator: SA-Q-005 / RTO; RPO; Zakres testu odtworzenia
  - source_id: SRC-AGENTS
    locator: §25
- id: NFR-005
  description: MVP obsługuje co najmniej 100 aktywnych rodzin i 10 równoczesnych zajęć
    oraz pozwala rozwijać skalę.
  rationale: Początkowa zdolność nie może ograniczać się do jednej grupy.
  priority: MUST
  br_refs:
  - BR-025
  acceptance_criteria:
  - Rodzina jest liczona raz niezależnie od dzieci i programów, jeśli dziecko ma w
    miesiącu aktywne uczestnictwo w trwającym programie lub opłacone uczestnictwo
    obejmujące miesiąc realizacją.
  - Równoczesne zajęcia to nakładające się wystąpienia live; liczebność grupy nie
    zwiększa liczby zajęć.
  - Minimalny test obejmuje co najmniej 100 aktywnych rodzin i 10 równoczesnych zajęć
    oraz równoczesne logowanie, panele, harmonogram, materiały, prace, wyniki i podstawową
    administrację.
  - W tym profilu typowe synchroniczne operacje backendu osiągają p95 do dwóch sekund,
    p99 do pięciu sekund i udział błędów technicznych poniżej jednego procenta w okresie
    testu.
  - Długotrwałe operacje, raporty i integracje asynchroniczne mogą przekraczać dwie
    sekundy, ale dają jednoznaczne potwierdzenie przyjęcia.
  - Ocena rozwoju do około 10 000 rodzin i 200 zajęć zachowuje podstawowe pojęcia
    edukacji i handlu bez fundamentalnej przebudowy domeny; nie wymaga tej skali przy
    uruchomieniu pilota.
  source_refs:
  - source_id: SRC-BA
    locator: BR-025; Q-017
  - source_id: SRC-SYSTEM
    locator: SA-Q-004 / Aktywna rodzina; Równoczesne zajęcia; Profil obciążenia MVP
- id: NFR-006
  description: Interfejs jest oceniany względem celu projektowego WCAG 2.2 AA.
  rationale: Dostępność wspiera samodzielne korzystanie z nauki.
  priority: SHOULD
  br_refs:
  - BR-022
  acceptance_criteria:
  - Przegląd procesów obejmuje klawiaturę, etykiety, kontrast, fokus, komunikaty,
    skalowanie i responsywność.
  - Wynik wskazuje kryteria WCAG 2.2 AA, naruszenia i ograniczenia; samo narzędzie
    automatyczne nie dowodzi pełnej zgodności.
  - Matematyka jest objęta oceną; dostosowania nie zmieniają mierzonej umiejętności.
  source_refs:
  - source_id: SRC-BA
    locator: BR-022
  - source_id: SRC-AGENTS
    locator: §24
- id: NFR-007
  description: Pliki i wyrażenia matematyczne podlegają walidacji i ochronie zasobów.
  rationale: Treści nie mogą powodować wykonania kodu ani wycieku.
  priority: MUST
  br_refs:
  - BR-007
  - BR-019
  - BR-023
  acceptance_criteria:
  - MVP dopuszcza PDF, JPG/JPEG, PNG, WEBP i DOCX; plik ma najwyżej 20 MB, a jedno
    przesłanie zadania lub wiadomości najwyżej pięć plików.
  - Zwykłe załączniki użytkownika nie dopuszczają plików wykonywalnych, skryptów ani
    archiwów.
  - Kontrola obejmuje rozszerzenie, deklarowany MIME, rzeczywisty typ/magic bytes,
    rozmiar, złośliwą zawartość i uprawnienie do zasobu.
  - Niezweryfikowany plik jest niedostępny innym użytkownikom; odrzucenie lub awaria
    kontroli nie daje bezpiecznego dopuszczenia.
  - Wyrażenia nie wykonują arbitralnego kodu; ocena jest wykonywana po stronie systemu
    według kryteriów.
  source_refs:
  - source_id: SRC-BA
    locator: BR-007; BR-019; BR-023
  - source_id: SRC-SYSTEM
    locator: SA-Q-007 / Pliki w MVP
  - source_id: SRC-AGENTS
    locator: §23; §24
- id: NFR-008
  description: Diagnostyka i monitoring wykrywają zakłócenia z zachowaniem poufności.
  rationale: Utrzymanie nie może ujawniać sekretów ani danych dzieci.
  priority: MUST
  br_refs:
  - BR-015
  - BR-019
  - BR-026
  acceptance_criteria:
  - Logi nie zawierają haseł, sekretów, tokenów, pełnych danych kart ani wrażliwych
    danych osobowych.
  - Techniczna diagnostyka ma domyślną retencję 30 dni, zmienną zatwierdzoną polityką;
    audyt biznesowy i bezpieczeństwa ma odrębną retencję i nie jest automatycznie
    usuwany po 30 dniach.
  - Krytyczny alert powstaje przy pięciu kolejnych minutach niedostępności podstawowego
    procesu, trzech kolejnych nieudanych próbach krytycznej integracji lub trwałym
    błędzie zapisu/odczytu danych biznesowych.
  - Monitoring wykrywa istotny wzrost błędów autoryzacji, płatności i dostępu do plików;
    próg jest konfigurowalny i wymaga SA-Q-009 zamiast wymyślonej wartości.
  - Progi alertów są konfigurowalne bez zmiany kodu domenowego; diagnostyka i audyt
    są dostępne wyłącznie uprawnionym i pozwalają powiązać decyzję z wykonawcą i czasem
    bez kopiowania pełnych danych dziecka.
  source_refs:
  - source_id: SRC-BA
    locator: BR-015; BR-019; BR-026
  - source_id: SRC-SYSTEM
    locator: SA-Q-007 / Diagnostyka; Alerty
  - source_id: SRC-AGENTS
    locator: §23
- id: NFR-009
  description: Znaczące czasy i historia pozostają jednoznaczne podczas zmiany czasu.
  rationale: Harmonogram, konsultacje, KPI i audyt wymagają spójnej chronologii.
  priority: MUST
  br_refs:
  - BR-006
  - BR-013
  - BR-015
  - BR-024
  acceptance_criteria:
  - Zdarzenia zachowują jednoznaczny instant, strefę albo offset odpowiednio do znaczenia.
  - Harmonogram, granice tygodnia konsultacji i dni KPI stosują Europe/Warsaw także
    przy zmianie czasu.
  - Nieistniejący lub dwuznaczny lokalny termin wymaga rozstrzygnięcia; audyt zachowuje
    rzeczywistą kolejność zdarzeń.
  source_refs:
  - source_id: SRC-BA
    locator: BR-006; BR-013; BR-015; BR-024
  - source_id: SRC-SYSTEM
    locator: SA-Q-003; SA-Q-004 / Deduplikacja klienta dla kontynuacji
  - source_id: SRC-AGENTS
    locator: §21 Time
- id: NFR-010
  description: Ponowienia integracji są ograniczone i nie powielają skutków biznesowych.
  rationale: Niedostępność dostawcy nie może tworzyć wielokrotnych operacji ani fikcyjnego
    sukcesu.
  priority: MUST
  br_refs:
  - BR-004
  - BR-016
  - BR-018
  - BR-026
  acceptance_criteria:
  - Bezpiecznie ponawialna operacja wychodząca ma pierwszą próbę natychmiast i kolejne
    po około jednej, pięciu i piętnastu minutach zgodnie ze wsadem; po wyczerpaniu
    prób trafia do ręcznej obsługi lub rejestru błędów.
  - Operacja bez bezpiecznej idempotencji nie jest automatycznie ponawiana.
  - Wielokrotne webhooki i callbacki tego samego zdarzenia nie powielają skutków.
  - Status niejednoznaczny pozostaje do weryfikacji, a nie staje się sukcesem; dokładna
    interpretacja odstępów i tolerancji pozostaje SA-Q-009.
  source_refs:
  - source_id: SRC-BA
    locator: BR-004; BR-016; BR-018; BR-026
  - source_id: SRC-SYSTEM
    locator: SA-Q-007 / Retry integracji
