    opcjonalny plan rozliczeniowy zachowuje wartości elementów zakupionej usługi.
  requirement_refs:
  - FR-004
  - FR-018
  - NFR-002
- id: DOM-007
  description: Attempt / result / completion — historyczna próba, status oceny i ukończenie
    nie są zamienne.
  requirement_refs:
  - FR-009
  - FR-010
  - FR-011
- id: DOM-008
  description: Progression condition / exception — skonfigurowany warunek lub audytowane
