revision: 1
status: BLOCKED
approval: null
scope: >-
  Analiza systemowa MVP eSzkola na rynku polskim na podstawie dokładnie
  zatwierdzonej BA revision 6. Obejmuje uczestnictwo, edukację, handel w PLN,
  komunikację, administrację, ochronę danych, KPI i jakość usługi.
  Nie obejmuje wyboru technologii ani dostawców, finalnej architektury,
  implementacji, zadań, DAG ani zatwierdzania artefaktów. Poza MVP pozostają
  własne wideokonferencje, marketplace, aplikacje natywne, publiczne profile
  dzieci, otwarty czat, AI tutor, wiele walut i rozpoznawanie pisma odręcznego.
