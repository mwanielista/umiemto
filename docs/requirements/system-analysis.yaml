scope: Analiza systemowa MVP eSzkola dla rynku polskiego na podstawie dokładnie zatwierdzonej
  BA revision 6 i kanonicznego wsadu systemowego 1.0. Obejmuje konta, relacje opiekunów,
  edukację, konfigurowalne programy, handel w PLN, konsultacje, administrację, raportowanie,
  bezpieczeństwo i jakość. Wyklucza własne wideokonferencje, marketplace, aplikacje
  natywne, publiczne profile dzieci, otwarty czat, AI tutor, wiele walut i rozpoznawanie
  odręcznych równań. Pakiety, premium, B2B i wideokonsultacje 1:1 nie są obowiązkowym
  MVP. Nie wybiera technologii, dostawców ani finalnej architektury i nie tworzy zadań.
