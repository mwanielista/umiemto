    i realizacji.
  requirement_refs:
  - FR-017
  - FR-002
- id: DOM-003
  description: Published program version — identyfikowalna podstawa uczestnictwa i
    oceny.
  requirement_refs:
  - FR-017
  - FR-009
  - FR-010
- id: DOM-004
  description: Scheduled group / lesson occurrence — grupa i wystąpienie zajęć odrębne
    od definicji i zapisu.
  requirement_refs:
  - FR-004
  - FR-006
  - FR-021
- id: DOM-005
  description: Enrollment / purchased terms — uczestnictwo powiązane z ofertą, okresem
    dostępu i zakupionymi warunkami.
  requirement_refs:
  - FR-004
  - FR-018
- id: DOM-006
