use_cases:
- id: UC-001
  description: Opiekun tworzy konto i profil dziecka oraz zarządza uprawnionym dostępem.
  requirement_refs:
  - FR-001
  - FR-014
  - FR-019
  - FR-015
  - NFR-001
  actor_refs:
  - ACT-001
  - ACT-002
  - ACT-005
  preconditions:
  - Rejestracja jest dostępna; czynności dorosłego podlegają weryfikacji uprawnienia.
  main_flow:
  - Opiekun podaje wymagane dane i oświadczenia.
  - System zachowuje konto i wersjonowane akceptacje.
  - Pierwszy zweryfikowany opiekun uzyskuje status głównego.
  - Opiekun tworzy dostęp dziecka i otrzymuje login.
  - Dziecko loguje się do własnego panelu.
  alternatives:
  - Główny opiekun zaprasza konkretną osobę, która przyjmuje zaproszenie na własnym
    koncie.
  - Odebranie relacji blokuje dalszy dostęp i zachowuje historię.
  - Zmiana głównego wymaga jego zgody lub ręcznej zweryfikowanej decyzji administratora.
  - Spór blokuje zmiany do rozstrzygnięcia; utrata wszystkich opiekunów wymaga ręcznej
    weryfikacji.
  - Uprawniony opiekun odzyskuje dostęp dziecka; recovery administratora jest audytowane.
  postconditions:
  - Dziecko nie uzyskuje prawa zakupów ani czynności dorosłego; relacje i akceptacje
    są rozliczalne.
- id: UC-002
  description: Nauczyciel przygotowuje i publikuje wersję programu.
  requirement_refs:
  - FR-017
  - FR-002
  - FR-003
  - FR-009
  - FR-015
  actor_refs:
  - ACT-003
  - ACT-004
  preconditions:
  - Użytkownik ma uprawnienie do treści.
  main_flow:
  - Nauczyciel określa strukturę i cele.
  - Określa wejście, ocenę, ukończenie i progresję.
  - Zachowuje informacje jakościowe i prawa materiałów.
  - Publikuje identyfikowalną wersję oraz ofertę.
  alternatives:
  - Program może nie mieć egzaminu.
  - Edycja nie nadpisuje historii; pogorszenie podlega UC-006.
  postconditions:
  - Oferta wskazuje wersję; wcześniejsza historia pozostaje.
- id: UC-003
  description: Opiekun kupuje udział dziecka w grupie.
  requirement_refs:
  - FR-002
  - FR-003
  - FR-004
  - FR-005
  - FR-016
  - FR-018
  - NFR-002
  actor_refs:
  - ACT-001
  - ACT-007
  - ACT-005
  preconditions:
  - Opiekun ma uprawnienie do dziecka; oferta jest opublikowana.
  main_flow:
  - Opiekun poznaje warunki i cenę brutto.
  - Wybiera ofertę oraz uczestnika.
  - System sprawdza miejsca i zachowuje zamówienie oraz ewentualną rezerwację do 24
    godzin.
  - Dostawca przetwarza płatność.
  - System weryfikuje potwierdzenie i potwierdza jedno uczestnictwo przy dostępności
    miejsca.
  alternatives:
  - Duplikat nie tworzy dodatkowego skutku.
  - Błąd płatności nie potwierdza uczestnictwa.
  - Spóźniona wpłata pozostaje na pierwotnym zamówieniu; brak miejsca uruchamia propozycję
    zaakceptowanej alternatywy albo pełnego zwrotu.
  - Brak decyzji nie oznacza zgody na inną grupę.
  - Zakup nie zastępuje warunku rozpoczęcia.
  postconditions:
  - Status odpowiada zweryfikowanej płatności i rzeczywistej dostępności; sprawa nierozstrzygnięta
    jest widoczna.
- id: UC-004
  description: Uczestnik realizuje zajęcia, zadania i trening.
  requirement_refs:
  - FR-006
  - FR-007
  - FR-008
  - FR-012
  - FR-022
  - FR-023
  - NFR-007
  actor_refs:
  - ACT-002
  - ACT-003
  - ACT-008
  preconditions:
  - Uczestnik ma uprawniony dostęp do elementu.
  main_flow:
  - Panel pokazuje następny krok i harmonogram.
  - Uczestnik dołącza do zewnętrznej lekcji.
  - Nauczyciel zapisuje realizację i obecność.
  - Uczestnik korzysta z materiałów i przesyła pracę.
  - System kontroluje załączniki i ocenia według kryteriów albo kieruje do nauczyciela.
  alternatives:
  - Błąd przesłania nie oznacza oddania pracy.
  - Niezweryfikowany plik nie jest udostępniany innym.
  - Okres materiałów może wygasnąć.
  - Awaria zajęć prowadzi do UC-006.
  postconditions:
  - Realizacja i odpowiedzi są powiązane z uczestnictwem.
- id: UC-005
  description: Uczestnik uzyskuje ocenę, ukończenie i progresję.
  requirement_refs:
  - FR-009
  - FR-010
  - FR-011
  - FR-005
  - FR-012
  - FR-015
  actor_refs:
  - ACT-002
  - ACT-003
  - ACT-005
  - ACT-006
  preconditions:
  - Próba lub wymagany element są dostępne zgodnie z wersją.
  main_flow:
  - System zachowuje podstawę próby.
  - Ocenia elementy automatyczne i przekazuje ręczne.
  - Uprawniona osoba zatwierdza po wymaganej weryfikacji.
  - System ustala ukończenie i właściwą progresję.
  - Rodzina otrzymuje wynik i następny krok.
  alternatives:
  - Podejrzenie niesamodzielności pozostawia wynik niefinalny.
  - Niezaliczenie umożliwia bezpłatną kolejną próbę według programu.
  - Program bez egzaminu stosuje wymagane elementy.
  - Uprawniony wyjątek zachowuje audyt.
  postconditions:
  - Historia jest odtwarzalna; warunek wymagający zaliczenia spełnia wynik finalny
    lub ważny wyjątek.
- id: UC-006
  description: Organizator obsługuje zakłócenie lub pogorszenie zakupionej usługi.
  requirement_refs:
  - FR-018
  - FR-021
  - FR-016
  - FR-015
  - NFR-002
  actor_refs:
  - ACT-001
  - ACT-003
  - ACT-005
  - ACT-006
  - ACT-007
  preconditions:
  - Istnieje zakupiona usługa i uprawniona osoba prowadząca sprawę.
  main_flow:
  - Organizator zapisuje przyczynę i kwalifikację uprawnionej osoby.
  - Ustala zastępstwo albo nowy termin.
  - Informuje rodzinę i zbiera wymaganą akceptację konkretnego pogorszenia.
  - Przy braku akceptacji i niemożliwości pierwotnej realizacji zapisuje zaakceptowaną
    alternatywę albo zwrot.
  - Wycenia niezrealizowane elementy z zakupionego planu i kontroluje limit zwrotu.
  - Śledzi rzeczywisty wynik zwrotu i audyt.
  alternatives:
  - Przed rozpoczęciem niemożliwej usługi zwrot jest pełny.
  - Bez jednoznacznego planu administrator podaje kwotę i uzasadnienie zgodnie z zatwierdzoną
    polityką.
  - Spór kwalifikacyjny rozstrzyga właściciel lub formalnie uprawniona osoba.
  - Nieobecność uczestnika nie daje automatycznego zwrotu.
  postconditions:
  - Zmiana i rozliczenie są możliwe do prześledzenia; zlecenie nie jest mylone ze
    skutecznym zwrotem.
- id: UC-007
  description: Uczestnik lub opiekun korzysta z konsultacji asynchronicznej.
  requirement_refs:
  - FR-013
  - FR-014
  - FR-015
  - NFR-009
  actor_refs:
  - ACT-002
  - ACT-001
  - ACT-003
  - ACT-005
  preconditions:
  - Uczestnictwo jest aktywne i znajduje się w okresie konsultacji; wspólny limit
    pozwala na nowy wątek.
  main_flow:
  - Dziecko lub opiekun w jego imieniu otwiera wątek.
  - System przypisuje tydzień i zużywa wspólny limit.
  - Nauczyciel odpowiada w kontrolowanym kanale.
  - Opiekun widzi komunikację.
  - Nauczyciel lub administrator zamyka rozwiązany wątek; historia pozostaje.
  alternatives:
  - Drugi nowy wątek w tygodniu jest ograniczony niezależnie od autora.
  - Odpowiedź nie zużywa limitu.
  - Święto w Polsce nie jest dniem roboczym celu odpowiedzi.
  - Koniec uprawnionego okresu pozwala zamknąć wątek; zwykły użytkownik nie usuwa
    historii.
  postconditions:
  - Wątek jest rozliczalny, a czas odpowiedzi i limit mogą być zweryfikowane.
- id: UC-008
  description: Właściciel ocenia KPI pilota i dane do ekonomiki.
  requirement_refs:
  - FR-024
  - FR-006
  - FR-009
  - FR-014
  actor_refs:
  - ACT-006
  - ACT-005
  - ACT-001
  preconditions:
  - Istnieją dane badanego zakresu i uprawnienie do raportu.
  main_flow:
  - System ustala zakres pomiaru.
  - Oblicza ukończenia i deduplikowane kwalifikacje kontynuacji.
  - Agreguje obecności względem możliwych obecności.
  - Zbiera jedną ankietę głównego opiekuna ustalonego na koniec uczestnictwa.
  - Pokazuje KPI oraz sprzedaż, zwroty, miejsca i uczestnictwa do oceny poza systemem.
  alternatives:
  - Brak właściwej oferty wyłącza z kontynuacji.
  - Zerowy mianownik daje brak podstawy wskaźnika.
  - Zmiana głównego opiekuna nie tworzy kolejnej ankiety.
  - Osobny budżet i ocena ekonomiczna nie uruchamiają automatycznego GO/NO-GO.
  postconditions:
  - Raport umożliwia ocenę celów i zestawienie kosztów poza systemem.
domain_concepts:
- id: DOM-001
