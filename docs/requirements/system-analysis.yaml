open_questions:
- id: SA-Q-001
  question: Jak określić dostęp dziecka, cykl relacji opiekunów, macierz uprawnień
    i MFA? Historycznie BLOCKER w revision 2.
  severity: BLOCKER
  owner: Michał Wanielista
  affected_refs:
  - FR-001
  - FR-014
  - NFR-001
  - UC-001
  - DATA-001
  status: RESOLVED
  resolution:
    answer: Własny login dziecka bez wymogu e-mail/telefonu, hasło i recovery przez
      opiekuna; główny opiekun zaprasza i odwołuje dodatkowych. Zmiana głównego i
      spory mają kontrolowane ręczne rozstrzygnięcie. Macierz rozdziela role i zasoby.
      MFA obowiązuje uprzywilejowanych; recovery przez kod lub odrębnego zweryfikowanego
      administratora, reset unieważnia konfigurację i wymusza nową z audytem.
    evidence: SRC-SYSTEM sha256:463407fdc43dd8c5ca8cd3d2db66feb763b05ce0b41b94bab754c2393af6cd80
      / SA-Q-001, Status RESOLVED; decyzja Michała Wanielisty. Poprzedni zakres pytania
      zachowany z SA revision 2, snapshot sha256:827114f8126bcce945b01f12b55f6b473b77aac7b58762beaf9842f3f4694365.
- id: SA-Q-002
  question: Jak obsłużyć późną płatność, utratę miejsca, wycenę zwrotu i kwalifikację
    pogorszenia? Historycznie BLOCKER w revision 2.
  severity: BLOCKER
  owner: Michał Wanielista
  affected_refs:
  - FR-004
  - FR-018
  - UC-003
  - UC-006
  - DATA-003
  status: RESOLVED
  resolution:
    answer: Płatność pozostaje na pierwotnym zamówieniu; brak miejsca prowadzi do
      zaakceptowanej alternatywy albo pełnego zwrotu bez domniemania zgody. Zakupiony
      plan określa wartości elementów; bez planu administrator podejmuje uzasadnioną
      decyzję według polityki. Limit odejmuje wcześniejsze skuteczne zwroty. Kwalifikacja
      pogorszenia jest decyzją uprawnionego administratora lub właściciela, nie automatyczną
      oceną prawną.
    evidence: SRC-SYSTEM sha256:463407fdc43dd8c5ca8cd3d2db66feb763b05ce0b41b94bab754c2393af6cd80
      / SA-Q-002, Status RESOLVED; decyzja Michała Wanielisty. Poprzedni zakres pytania
      zachowany z SA revision 2, snapshot sha256:827114f8126bcce945b01f12b55f6b473b77aac7b58762beaf9842f3f4694365.
- id: SA-Q-003
  question: Jak określić wspólny limit, dni robocze, aktywność programu i zamknięcie
    konsultacji? Historycznie NON_BLOCKER, bo podstawowy limit i zakres były znane.
  severity: NON_BLOCKER
  owner: Michał Wanielista
  affected_refs:
  - FR-013
  - UC-007
  - DATA-006
  status: RESOLVED
  resolution:
    answer: Opiekun inicjuje w imieniu dziecka; limit jeden nowy wątek na aktywne
      uczestnictwo/program jest wspólny dla wszystkich, tygodniowy Europe/Warsaw.
      Dni robocze to poniedziałek–piątek bez polskich świąt. Aktywność wymaga aktywnego
      uczestnictwa i właściwego okresu dostępu. Nauczyciel lub administrator zamyka
      rozwiązany wątek albo po końcu okresu; historia pozostaje.
    evidence: SRC-SYSTEM sha256:463407fdc43dd8c5ca8cd3d2db66feb763b05ce0b41b94bab754c2393af6cd80
      / SA-Q-003, Status RESOLVED; decyzja Michała Wanielisty.
- id: SA-Q-004
  question: Jak określić rodzinę, równoczesne zajęcia, profil ruchu i jednostki KPI?
    Historycznie NON_BLOCKER, bo cele skali i podstawowe KPI były znane.
  severity: NON_BLOCKER
  owner: Michał Wanielista
  affected_refs:
  - FR-024
  - NFR-005
  - UC-008
  - DATA-007
  status: RESOLVED
  resolution:
    answer: Rodzina z aktywnym lub opłaconym uczestnictwem obejmującym miesiąc jest
      liczona raz; zajęcia live są nakładającymi się wystąpieniami. Test minimum 100
      rodzin i 10 zajęć obejmuje wymienione procesy z p95 do dwóch sekund, p99 do
      pięciu i błędami poniżej jednego procenta. Główny opiekun dla ankiety jest ustalony
      na zakończenie. Kwalifikacja kontynuacji używa opiekuna kupującego, dziecka,
      uczestnictwa i logicznej kontynuacji; płatność do końca 60. dnia Europe/Warsaw
      liczy się do okna.
    evidence: SRC-SYSTEM sha256:463407fdc43dd8c5ca8cd3d2db66feb763b05ce0b41b94bab754c2393af6cd80
      / SA-Q-004, Status RESOLVED; decyzja Michała Wanielisty.
- id: SA-Q-005
  question: Jak mierzyć dostępność, granice RTO/RPO i kompletność odtworzenia? Historycznie
    NON_BLOCKER, bo cele i zakres BA były znane.
  severity: NON_BLOCKER
  owner: Michał Wanielista
  affected_refs:
  - NFR-003
  - NFR-004
  - NFR-008
  - ERR-009
  status: RESOLVED
  resolution:
    answer: Dostępność mierzy się minutowo z dwiema nieudanymi próbami lub potwierdzoną
      blokującą awarią. RTO zaczyna wcześniejsze wykrycie lub potwierdzenie i kończy
      przywrócenie z 15 minutami poprawnych kontroli. RPO porównuje ostatni poprawnie
      zapisany i najnowszy odtwarzalny stan. Test obejmuje wszystkie wskazane dane,
      pliki, audyt, spójność i procesy.
    evidence: SRC-SYSTEM sha256:463407fdc43dd8c5ca8cd3d2db66feb763b05ce0b41b94bab754c2393af6cd80
      / SA-Q-005, Status RESOLVED; decyzja Michała Wanielisty.
- id: SA-Q-006
  question: Jak potraktować finalne kwestie prawne, podatkowe, retencyjne i proceduralne?
    NON_BLOCKER dla SA, ponieważ BA jawnie odracza je do produkcji.
  severity: NON_BLOCKER
  owner: Michał Wanielista
  affected_refs:
  - FR-001
  - FR-010
  - FR-018
  - FR-019
  - FR-020
  - FR-021
  - NFR-008
  status: RESOLVED
  resolution:
    answer: Rozwiązano decyzję systemową, nie zatwierdzono finalnych treści prawnych.
      System wspiera wersjonowane akceptacje, konfigurowalną retencję i podatki, dokumenty
      sprzedaży powiązane z zamówieniem, statusy spraw oraz kontrolowane procesy z
      audytem. Szczegóły pozostają wymaganymi bramkami produkcyjnymi i otwartym SA-Q-010;
      BA Q-007–Q-010 pozostają niezmienione.
    evidence: SRC-SYSTEM sha256:463407fdc43dd8c5ca8cd3d2db66feb763b05ce0b41b94bab754c2393af6cd80
      / SA-Q-006, RESOLVED jako decyzja systemowa / pozostaje bramką produkcyjną;
      SRC-BA Q-007–Q-010.
- id: SA-Q-007
  question: Jakie formaty i limity plików, retry, diagnostyka i alerty obowiązują?
    Historycznie NON_BLOCKER, bo podstawowy zakres ochrony i błędów był znany.
  severity: NON_BLOCKER
  owner: Michał Wanielista
  affected_refs:
  - FR-007
  - FR-016
  - NFR-007
  - NFR-008
  - INT-003
  - INT-004
  - NFR-010
  status: RESOLVED
  resolution:
    answer: Dopuszczono PDF, JPG/JPEG, PNG, WEBP i DOCX, najwyżej 20 MB i pięć plików
      na przesłanie; wymagane są kontrola rzeczywistego typu, malware i dostępu. Bezpieczne
      retry ma pierwszą próbę natychmiast, następnie około jednej, pięciu i piętnastu
      minut, potem obsługę ręczną. Diagnostyka domyślnie trwa 30 dni odrębnie od audytu.
      Wskazano krytyczne warunki alertów i konfigurowalność. Doprecyzowanie nieokreślonego
      progu istotnego wzrostu i tolerancji retry pozostaje SA-Q-009 bez ponownego
      otwierania tej decyzji.
    evidence: SRC-SYSTEM sha256:463407fdc43dd8c5ca8cd3d2db66feb763b05ce0b41b94bab754c2393af6cd80
      / SA-Q-007, Status RESOLVED; decyzja Michała Wanielisty.
- id: SA-Q-008
  question: Jakie kryteria ekonomiki i budżet pilota obowiązują? NON_BLOCKER dla SA,
    ponieważ ekonomika jest oceną pilota poza automatycznymi regułami produktu.
  severity: NON_BLOCKER
  owner: Michał Wanielista
  affected_refs:
  - FR-024
  status: RESOLVED
  resolution:
    answer: System dostarcza przychody, zwroty, płatne uczestnictwa, wykorzystanie
      miejsc i kontynuacje do oceny kosztów poza systemem. Dodatnia marża, docelowe
      LTV/CAC co najmniej trzy i zwrot CAC po pierwszych jednym–dwóch programach są
      pomocniczymi kryteriami biznesowymi, nie regułami platformy. Budżet zatwierdza
      osobno właściciel; nie wymaga się pełnego P&L ani automatycznego GO/NO-GO. BA
      nie została zmieniona.
    evidence: SRC-SYSTEM sha256:463407fdc43dd8c5ca8cd3d2db66feb763b05ce0b41b94bab754c2393af6cd80
      / SA-Q-008, Status RESOLVED; SRC-BA Q-012 pozostaje niezmienione.
- id: SA-Q-009
  question: Jakie bazowe okno i próg definiują istotny wzrost błędów autoryzacji,
    płatności i dostępu do plików oraz jakie są tolerancje i punkt odniesienia odstępów
    retry około jednej, pięciu i piętnastu minut? NON_BLOCKER dla SA, ponieważ zakres
    monitorowania, trzy konkretne warunki krytyczne, liczba i przybliżony harmonogram
    bezpiecznych prób są określone; doprecyzowanie jest konieczne przed akceptacją
    konfiguracji operacyjnej i jej testów, bez wyboru wartości domyślnych.
