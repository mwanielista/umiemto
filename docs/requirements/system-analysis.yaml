  requirement_refs:
  - FR-005
  - FR-015
- id: DOM-009
  description: Consultation thread — archiwizowany wątek uczestnictwa ze wspólnym
    limitem dziecka i opiekunów.
  requirement_refs:
  - FR-013
- id: DOM-010
  description: KPI cohort / continuation eligibility — kwalifikacja opiekuna kupującego,
    dziecka, zakończonego uczestnictwa i logicznej kontynuacji; aktywna rodzina jest
    inną jednostką skali.
  requirement_refs:
  - FR-024
  - NFR-005
data_requirements:
- id: DATA-001
  description: Konta i relacje zachowują głównego opiekuna, osobę zaproszoną, dziecko,
    przyjęcie, aktywność, historię nadania/odebrania, zgody na zmianę i ręczne decyzje.
    Zgody/oświadczenia zachowują wersję, osobę i czas. Dane recovery mają kontrolowany
    dostęp; odebranie relacji nie usuwa audytu.
  requirement_refs:
  - FR-001
  - FR-014
  - FR-019
  - FR-015
  - NFR-001
- id: DATA-002
  description: Definicja, wersja, oferta, grupa, harmonogram i uczestnictwo są rozróżnialne.
    Zachowane są zakupione warunki, PLN, cena brutto, okresy dostępu, kryteria wejścia,
    oceny, ukończenia i progresji oraz historia zmian, kwalifikacji pogorszenia i
    akceptacji.
  requirement_refs:
  - FR-002
  - FR-003
  - FR-004
  - FR-017
  - FR-018
- id: DATA-003
  description: Zamówienie, rezerwacja, płatność i zwrot mają tożsamość, status, kwotę,
    walutę i zweryfikowane zdarzenia. Spóźniona wpłata zachowuje pierwotne zamówienie.
    Zakupiony opcjonalny plan rozliczeniowy i realizacja elementów pozwalają wycenić
    niezrealizowaną część; ręczna decyzja ma podstawę, osobę, czas i uzasadnienie.
    Historia skutecznych zwrotów pozwala kontrolować limit.
  requirement_refs:
  - FR-004
  - FR-018
  - NFR-002
- id: DATA-004
  description: Próba zachowuje odpowiedzi, dokładne wersje pytań i zasad, kryteria,
    statusy wyników, weryfikacje i korekty. Materiały i prace mają program, uczestnictwo,
    prawa użycia i okres dostępu. Plik zachowuje typ, rozmiar, wynik kontroli i status
    dopuszczenia; edycja nie usuwa historycznej podstawy oceny.
  requirement_refs:
  - FR-007
  - FR-008
  - FR-009
  - FR-010
  - FR-017
  - NFR-007
- id: DATA-005
  description: Harmonogram i frekwencja zachowują konkretne zajęcia, realizację, uczestnika,
    obecność, odwołanie i powiązanie przełożenia. Czas pozwala odtworzyć chronologię
    i prezentację Europe/Warsaw.
  requirement_refs:
  - FR-006
  - FR-021
  - FR-024
  - NFR-009
- id: DATA-006
  description: Konsultacje zachowują dziecko, uczestnictwo/program, autorów, czasy,
    tydzień wspólnego limitu, wiadomości, odpowiedzi, zamknięcie i moderację. Aktywność
    i okres konsultacji są odtwarzalne; historia ma zasobowe uprawnienia i zatwierdzoną
    retencję.
  requirement_refs:
  - FR-013
  - FR-014
  - FR-015
  - FR-019
- id: DATA-007
  description: KPI zachowują rozpoczęcie, ukończenie, kwalifikację, logiczną kontynuację,
    udostępnienie zakupu, zweryfikowaną płatność i granice okna, obecności i ankiety.
    Główny opiekun jest ustalony na koniec uczestnictwa. Raport zachowuje zakres,
    liczniki i mianowniki oraz dane sprzedaży, zwrotów, miejsc i kontynuacji do oceny
    ekonomiki poza systemem.
  requirement_refs:
  - FR-024
  - NFR-005
- id: DATA-008
  description: Powiadomienia zachowują zdarzenie, odbiorców, próby i status. Audyt
    zachowuje wykonawcę, zasób, działanie, czas i uzasadnienie, odrębnie od diagnostyki
    30-dniowej. Sprawy, dokumenty sprzedaży powiązane z zamówieniem i przygotowanie
    nauczyciela mają śledzony status oraz zatwierdzone zasady dostępu i retencji.
    Dowody pomiarów i odtworzenia zachowują zakres, czasy i wyniki.
  requirement_refs:
  - FR-015
  - FR-016
  - FR-020
  - FR-021
  - FR-018
  - NFR-003
  - NFR-004
  - NFR-008
  - NFR-010
integrations:
- id: INT-001
  description: Płatności wymieniają odniesienie zamówienia, kwotę, PLN i status. System
    weryfikuje potwierdzenia, koreluje zwroty i spóźnione wpłaty z pierwotnym zamówieniem.
    Duplikat, sprzeczność, timeout i niejednoznaczny status nie tworzą fikcyjnego
    powodzenia. Bezpieczne ponowienia stosują NFR-010; nie wybrano operatora.
  requirement_refs:
  - FR-004
  - FR-018
  - NFR-002
  - NFR-010
- id: INT-002
  description: Zewnętrzne wideo realizuje lekcję; platforma udostępnia informacje
    uprawnionym. Awaria uniemożliwiająca zajęcia wymaga nowego terminu. Nie wymaga
    się API tworzenia spotkań ani nagrywania; dostępność informacji platformy jest
    odrębna od wideo.
  requirement_refs:
  - FR-006
  - FR-019
  - FR-021
  - NFR-003
- id: INT-003
  description: E-mail otrzymuje dane konieczne do powiadomienia; przekazanie, błąd
    i próby są rozróżnialne. Błąd nie cofa zdarzenia biznesowego. Bezpieczne ponowienia
    mają ograniczony harmonogram i kończą się ręczną obsługą po wyczerpaniu; nie wybrano
    dostawcy.
  requirement_refs:
  - FR-016
  - NFR-008
  - NFR-010
- id: INT-004
  description: Przechowywanie i kontrola plików zachowują powiązanie z zasobem, uprawnienia
    i status walidacji. Awaria storage lub skanowania nie oznacza bezpiecznego udostępnienia.
    Obowiązują limity i formaty NFR-007. S3-compatible storage jest istniejącym mandatem;
    nie wybrano dostawcy ani projektu adaptera.
  requirement_refs:
  - FR-007
  - NFR-007
  - NFR-010
edge_cases:
- id: EDGE-001
  description: Równoczesne działania opiekunów nie łączą uprawnień; po odebraniu relacji
    kolejne operacje są odrzucane, a spór może blokować zmiany do ręcznej decyzji.
  requirement_refs:
  - FR-001
  - FR-014
- id: EDGE-002
  description: Równoczesny zakup ostatniego miejsca nie przekracza limitu; wpłata
    po utracie miejsca wymaga zaakceptowanej alternatywy albo pełnego zwrotu, bez
    automatycznego przeniesienia.
  requirement_refs:
  - FR-004
  - FR-018
  - NFR-002
- id: EDGE-003
  description: Rezerwacja może być krótsza niż 24 godziny; jej wygaśnięcie nie usuwa
    powiązania późnej płatności z zamówieniem.
  requirement_refs:
  - FR-004
- id: EDGE-004
  description: Bez egzaminu i dodatkowych kryteriów ukończenie wynika z wymaganych
    elementów i nie dowodzi wszystkich efektów.
  requirement_refs:
  - FR-009
  - FR-024
- id: EDGE-005
  description: Prowadzący niebędący autorem może przyznać uprawniony wyjątek; sama
    rola metodyka nie wystarcza.
  requirement_refs:
  - FR-005
  - FR-014
  - FR-015
- id: EDGE-006
  description: Wysoki wynik wstępny lub wymagający weryfikacji nie spełnia finalnego
    warunku progresji.
  requirement_refs:
  - FR-005
  - FR-010
- id: EDGE-007
  description: Zmiana czasu i przełom tygodnia nie podwajają wspólnego limitu konsultacji;
    święto nie jest dniem roboczym, a dwuznaczny termin wymaga rozstrzygnięcia.
  requirement_refs:
  - FR-006
  - FR-013
  - NFR-009
- id: EDGE-008
  description: Przełożone zajęcia liczą się raz; odwołane niezrealizowane nie wchodzą
    do mianownika.
  requirement_refs:
  - FR-006
  - FR-021
  - FR-024
- id: EDGE-009
  description: Brak płatnej logicznej kontynuacji wyłącza z pomiaru; późniejsza oferta
    przesuwa początek okna, powtórne udostępnienie nie tworzy nowej kwalifikacji.
  requirement_refs:
  - FR-024
- id: EDGE-010
  description: Częściowa realizacja używa zakupionego planu rozliczeniowego albo uzasadnionej
    ręcznej kwoty; brak planu nie uzasadnia wymyślonej proporcji, a wcześniejsze zwroty
    obniżają dostępny limit.
  requirement_refs:
  - FR-018
  - NFR-002
- id: EDGE-011
  description: Wygaśnięcie materiałów i edycja programu nie nadpisują historycznej
    próby, oceny ani zakupionych warunków.
  requirement_refs:
  - FR-007
  - FR-010
  - FR-017
- id: EDGE-012
  description: Brak ankiet lub zerowy mianownik oznacza brak podstawy wskaźnika; zmiana
    głównego opiekuna nie tworzy drugiej ankiety.
  requirement_refs:
  - FR-024
error_scenarios:
- id: ERR-001
  description: Nieprawidłowe, powtórne lub sprzeczne potwierdzenie nie jest nową skuteczną
    płatnością; status niejednoznaczny wymaga weryfikacji.
  requirement_refs:
  - FR-004
  - NFR-002
  - NFR-010
- id: ERR-002
  description: Odmowa dostępu blokuje odczyt i zmianę bez ujawniania chronionej treści;
    recovery MFA nie może być zatwierdzone przez tego samego administratora.
  requirement_refs:
  - FR-014
  - NFR-001
- id: ERR-003
  description: Niekompletny plik, ponad 20 MB, ponad pięć załączników, niedozwolony
    format, niezgodny rzeczywisty typ, malware lub awaria skanowania nie dają bezpiecznie
    dopuszczonego załącznika.
  requirement_refs:
  - FR-007
  - NFR-007
- id: ERR-004
  description: Niebezpieczne wyrażenie jest odrzucane bez wykonania kodu; błąd obliczenia
    nie tworzy autorytatywnej oceny.
  requirement_refs:
  - FR-023
  - NFR-007
- id: ERR-005
  description: Awaria wideo wymaga nowego terminu; brak informacji do dołączenia po
    stronie eSzkola należy do pomiaru jej dostępności.
  requirement_refs:
  - FR-006
  - FR-021
  - NFR-003
- id: ERR-006
  description: Błąd e-mail zachowuje rzeczywisty stan biznesowy; wyczerpanie bezpiecznych
    prób wymaga ręcznej obsługi i nie jest udanym dostarczeniem.
  requirement_refs:
  - FR-016
  - NFR-008
  - NFR-010
- id: ERR-007
  description: Brak zatwierdzenia lub weryfikacji pozostawia wynik niefinalny w raporcie
    i progresji.
  requirement_refs:
  - FR-010
  - FR-012
  - FR-005
- id: ERR-008
  description: Nieudany zwrot nie jest rozliczeniem; kwota ponad pozostałą zapłatę
    jest odrzucana, a administracja widzi rzeczywisty status.
  requirement_refs:
  - FR-018
  - FR-021
  - NFR-002
- id: ERR-009
  description: Niespójne odtworzenie lub brak stabilnych kontroli nie dowodzi RPO/RTO;
    trwały błąd danych albo pięć minut niedostępności uruchamia krytyczny alert.
  requirement_refs:
  - NFR-004
  - NFR-008
  - NFR-003
security_requirements:
- id: SEC-001
  description: Kontrola sprawdza zasób i aktywną relację oraz rozdziela uczestnika,
    rodzinę, nauczyciela, metodyka, obsługę i administrację zgodnie z macierzą.
  requirement_refs:
  - FR-001
  - FR-014
  - NFR-001
- id: SEC-002
  description: MFA obejmuje wszystkie wskazane role uprzywilejowane; recovery nie
    jest samodzielnie zatwierdzane, reset wymusza nową konfigurację i audyt. HTTPS
    i ochrona sekretów są obowiązkowe.
  requirement_refs:
  - NFR-001
  - FR-015
- id: SEC-003
  description: Weryfikacja po stronie systemu, idempotencja i kontrola kwot chronią
    płatności i zwroty przed niezweryfikowanym klientem i duplikacją.
  requirement_refs:
  - FR-004
  - FR-018
  - NFR-002
  - NFR-010
- id: SEC-004
  description: Klucze egzaminu są chronione przed przedwczesnym ujawnieniem; matematyczne
    dane wejściowe nie wykonują kodu.
  requirement_refs:
  - FR-008
  - FR-023
  - NFR-007
- id: SEC-005
  description: Pliki wymagają kontroli typu, rozmiaru, liczby, złośliwej zawartości
    i zasobowego dostępu; oczekujące na kontrolę nie są dostępne innym.
  requirement_refs:
  - FR-007
  - FR-014
  - NFR-007
- id: SEC-006
  description: Minimalizacja wyklucza publiczne profile, prywatne kontakty nauczyciela
    i domyślne nagrywanie; retencja i prawa osób używają zatwierdzonych polityk.
  requirement_refs:
  - FR-013
  - FR-019
  - FR-020
- id: SEC-007
  description: Uprzywilejowane decyzje mają kontrolowany audyt odrębny od diagnostyki;
    logi wykluczają sekrety, karty i wrażliwe dane, a monitoring wykrywa krytyczne
    zakłócenia.
  requirement_refs:
  - FR-015
  - NFR-008
